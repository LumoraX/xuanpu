<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>玄圃</title>
  <link rel="stylesheet" href="startup.css">
  <script src="startup.js" defer></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">玄</div>
    <h1>玄圃</h1>
    <p class="tagline">从一句话，开始你的工作</p>
    <section aria-live="polite" aria-busy="true" id="connection">
      <p id="status">正在连接你的工作站…</p>
      <p id="detail">请稍候</p>
      <button id="retry" type="button" hidden>重新连接</button>
    </section>
    <p class="footer">你的企业工作，尽在玄圃</p>
  </main>
</body>
</html>
