<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>玄圃</title>
  <link rel="stylesheet" href="startup.css">
  <script src="startup.js" defer></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">玄</div>
    <h1>玄圃</h1>
    <p class="tagline">从一句话，开始你的工作</p>
    <section aria-live="polite" aria-busy="true" id="connection">
      <p id="status">正在连接你的工作站…</p>
      <p id="detail">请稍候</p>
      <button id="retry" type="button" hidden>重新连接</button>
    </section>
    <p class="server">服务器：<span id="server">读取中…</span> <button id="toggle" type="button" class="link">设置</button></p>
    <form id="settings" hidden>
      <label for="url">玄圃服务器地址</label>
      <input id="url" name="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://xuanpu.example.com">
      <p class="hint">保存到 <code id="config-path">~/.xuanpu/desktop.json</code>，只对本机生效。需使用 HTTPS（本机调试可用 http://127.0.0.1）。</p>
      <p id="form-error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit">保存并连接</button>
        <button id="reset" type="button" class="secondary">清除地址</button>
        <button id="logs" type="button" class="secondary">打开日志</button>
      </div>
    </form>
    <p class="footer">你的企业工作，尽在玄圃</p>
  </main>
</body>
</html>
