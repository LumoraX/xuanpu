[project]
name = "xuanpu-finance"
version = "2026.10.23.5"
description = "玄圃进程外财务：原件报销、实际HITL、付款记账与税务红字档案通用接口"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xuanpu-spec>=2026.10.21.1",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "defusedxml>=0.7.1",
    "cryptography>=42",
    "anyio>=4",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "pyyaml>=6",
    "PyJWT[crypto]>=2.9",
    "pypdf>=6",
    "pillow>=12",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
xuanpu-finance = "xuanpu_finance.__main__:main"
xuanpu-finance-maintenance = "xuanpu_finance.maintenance_cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xuanpu_finance"]
