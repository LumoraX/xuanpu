[project]
name = "xuanpu-server"
version = "2026.9.30.1"
description = "xuanpu 平台服务 —— 运行时（引擎承载、会话、事件流、审批待办）与控制面（租户、业务包、密钥、配额、审计）"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Xuanpu Contributors" },
]
keywords = ["llm", "agent", "platform", "xuanpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # 内核只用稳定层（红线 3）
    "taifeng>=2026.10.1.10",
    "taifeng-sandbox",
    "taifeng-stores",
    "xuanpu-spec>=2026.10.2.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # HTTP 接入层与密钥加密采用成熟组件（ADR 0003）
    "fastapi>=0.110",
    # HTTP 连接器的出口
    "httpx>=0.27",
    "uvicorn>=0.29",
    "cryptography>=42",
]

[project.optional-dependencies]
# 多实例部署：控制面、审计、线程目录与消息镜像落 Postgres
postgres = [
    "asyncpg>=0.29",
    "taifeng-stores[postgres]",
]

# 对象存储用 S3 兼容接口（阿里云 OSS 等）
s3 = [
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xuanpu_server"]
