[project]
name = "xuanpu-spec"
version = "2026.9.29.15"
description = "xuanpu 业务包规范 —— skills、连接器、策略、评测用例的清单 schema"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Xuanpu Contributors" },
]
keywords = ["llm", "agent", "platform", "xuanpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# 规范是业务方与平台之间的对外契约，不依赖平台其他组件，也不依赖 taifeng
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xuanpu_spec"]
