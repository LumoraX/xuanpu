# 持续门禁 —— 每次 push main / 每个 PR 都跑，口径与 taifeng 门禁一致。
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送作废旧的排队运行，红绿只反映 HEAD
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: 全量测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 财务及强制退出恢复纳入同一全量，保留租约自然到期的验证时间。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject classifiers 声明的受支持版本一一对应
        python-version: ["3.12", "3.13"]
    # 控制面与状态面的用例对真实数据库执行
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      finance_postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: finance_test_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XUANPU_TEST_PG_DSN: postgresql://postgres:test@127.0.0.1:5432/test
      FINANCE_TEST_DSN: postgresql://postgres:test@127.0.0.1:5433/finance_test_ci
    defaults:
      run:
        working-directory: xuanpu
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          path: xuanpu

      # 两个适配包尚未发布到 PyPI，工作区从同级目录取源码（pyproject 的 tool.uv.sources）
      - name: 检出 taifeng-sandbox
        uses: actions/checkout@v7
        with:
          repository: LumoraX/taifeng-sandbox
          ref: af3e54585d075e1ad75b6dd8882d7ca3c2c908c1
          path: taifeng-sandbox

      - name: 检出 taifeng-stores
        uses: actions/checkout@v7
        with:
          repository: LumoraX/taifeng-stores
          ref: 086f212be2867f311f6ad59673b8f521d8ea85fe
          path: taifeng-stores

      - name: 安装 uv
        # setup-uv 不发滚动大版本 tag，按上游写法用 commit SHA 钉死 + 版本号注释
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: 校验锁文件与 pyproject 一致
        run: uv lock --check

      - name: 安装 bubblewrap 并放开用户命名空间
        # 沙盒用例是真跑的；Ubuntu 24.04 默认用 AppArmor 限制非特权用户命名空间
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Linux 沙盒预检
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} --all-packages --all-extras pytest -q
          packages/xuanpu-server/tests/test_docker_identity_config.py
          packages/xuanpu-server/tests/test_ci_runtime_roots.py
          packages/xuanpu-server/tests/test_connector_sandbox.py
          packages/xuanpu-server/tests/test_sandbox_isolation.py
          packages/xuanpu-server/tests/identity/test_sdk_identity.py
          packages/xuanpu-server/tests/work_tasks/test_tools.py
          packages/xuanpu-server/tests/work_tasks/test_table_summary.py

      - name: 全量测试
        env:
          FINANCE_TEST_PG_CONTAINER: ${{ job.services.finance_postgres.id }}
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} --all-packages --all-extras pytest -q
          --durations=20 -o faulthandler_timeout=120

  lint:
    # F 未用/未定义名 · S108 硬编码 /tmp · I 导入排序 · TC 仅类型用 import 进 TYPE_CHECKING。
    # I 与 TC 必须同时入闸：TC 挪动 import 会制造 I001，单卡任一条都会被另一条反弹。
    name: 静态检查 (ruff F + S108 + I + TC · mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: xuanpu
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          path: xuanpu

      # 两个适配包尚未发布到 PyPI，工作区从同级目录取源码（pyproject 的 tool.uv.sources）
      - name: 检出 taifeng-sandbox
        uses: actions/checkout@v7
        with:
          repository: LumoraX/taifeng-sandbox
          ref: af3e54585d075e1ad75b6dd8882d7ca3c2c908c1
          path: taifeng-sandbox

      - name: 检出 taifeng-stores
        uses: actions/checkout@v7
        with:
          repository: LumoraX/taifeng-stores
          ref: 086f212be2867f311f6ad59673b8f521d8ea85fe
          path: taifeng-stores

      - name: 安装 uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: ruff F + S108 + I + TC 必须零错
        run: uv run --frozen --all-packages --all-extras ruff check --select F,S108,I,TC packages

      - name: mypy strict 必须零错
        run: uv run --frozen --all-packages --all-extras mypy packages/*/src
