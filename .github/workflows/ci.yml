# 持续门禁 —— 每次 push main / 每个 PR 都跑，口径与 taifeng 门禁一致。
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送作废旧的排队运行，红绿只反映 HEAD
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: 全量测试 (Python ${{ matrix.python-version }} · ${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    # 2026-11-19 前全量在一个任务里串行：3.12 实测 52–65 分钟（曾在 60 分钟被取消、放宽到 90），3.13 约 50 分钟。
    # 现按目录切成 4 个分片各开一个任务，每片独占自己的 runner 与两个 Postgres 服务，
    # 进程、端口、临时目录、模块级全局状态都不跨片共享，用例本身不需要为并行做任何改动。
    # 单片按 3.12 实测折算最长约 20 分钟（r3_contract），45 分钟足够覆盖慢 runner。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject classifiers 声明的受支持版本一一对应
        python-version: ["3.12", "3.13"]
        # 分片只用 pytest 自带的路径参数与 --ignore 表达；最后两片用「整体减去已列目录」写法，
        # 新增测试目录或新包会自动落进兜底分片，不会漏跑。
        # 所有分片的并集必须等于全量且两两不相交，由 tests/test_ci_shards.py 核对（静态检查任务里也单独跑）。
        # 改分片时只改这里；各片耗时占比见 README「CI 门禁」。
        shard:
          - name: r3_contract
            args: packages/xuanpu-server/tests/r3_contract
          - name: r4_contract+work_tasks+butler
            args: >-
              packages/xuanpu-server/tests/r4_contract
              packages/xuanpu-server/tests/work_tasks
              packages/xuanpu-server/tests/butler
          - name: server 其余
            args: >-
              packages/xuanpu-server
              --ignore=packages/xuanpu-server/tests/r3_contract
              --ignore=packages/xuanpu-server/tests/r4_contract
              --ignore=packages/xuanpu-server/tests/work_tasks
              --ignore=packages/xuanpu-server/tests/butler
          - name: 其他包
            args: packages --ignore=packages/xuanpu-server
    # 控制面与状态面的用例对真实数据库执行
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      finance_postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: finance_test_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      XUANPU_TEST_PG_DSN: postgresql://postgres:test@127.0.0.1:5432/test
      FINANCE_TEST_DSN: postgresql://postgres:test@127.0.0.1:5433/finance_test_ci
    defaults:
      run:
        working-directory: xuanpu
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          path: xuanpu
          # 内核 taifeng 与两个适配包是 external/ 下的子模块，版本由子模块指针钉死
          submodules: true

      - name: 安装 uv
        # setup-uv 不发滚动大版本 tag，按上游写法用 commit SHA 钉死 + 版本号注释
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: 校验锁文件与 pyproject 一致
        run: uv lock --check

      - name: 安装 bubblewrap 并放开用户命名空间
        # 沙盒用例是真跑的；Ubuntu 24.04 默认用 AppArmor 限制非特权用户命名空间
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Linux 沙盒预检
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} --all-packages --all-extras pytest -q
          packages/xuanpu-server/tests/test_docker_identity_config.py
          packages/xuanpu-server/tests/test_ci_runtime_roots.py
          packages/xuanpu-server/tests/test_connector_sandbox.py
          packages/xuanpu-server/tests/test_sandbox_isolation.py
          packages/xuanpu-server/tests/identity/test_sdk_identity.py
          packages/xuanpu-server/tests/work_tasks/test_tools.py
          packages/xuanpu-server/tests/work_tasks/test_table_summary.py

      - name: 全量测试（本分片）
        env:
          FINANCE_TEST_PG_CONTAINER: ${{ job.services.finance_postgres.id }}
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} --all-packages --all-extras pytest -q
          --durations=20 -o faulthandler_timeout=120
          ${{ matrix.shard.args }}

  lint:
    # F 未用/未定义名 · S108 硬编码 /tmp · I 导入排序 · TC 仅类型用 import 进 TYPE_CHECKING。
    # I 与 TC 必须同时入闸：TC 挪动 import 会制造 I001，单卡任一条都会被另一条反弹。
    name: 静态检查 (ruff F + S108 + I + TC · mypy strict · 分片覆盖)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: xuanpu
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          path: xuanpu
          # 内核 taifeng 与两个适配包是 external/ 下的子模块，版本由子模块指针钉死
          submodules: true

      - name: 安装 uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: ruff F + S108 + I + TC 必须零错
        run: uv run --frozen --all-packages --all-extras ruff check --select F,S108,I,TC packages

      - name: mypy strict 必须零错
        run: uv run --frozen --all-packages --all-extras mypy packages/*/src

      - name: 全量测试分片覆盖核对
        # 各分片收集到的用例并集必须等于全量、两两不相交；只做收集不跑用例，几十秒内出结果
        run: uv run --frozen --all-packages --all-extras pytest -q packages/xuanpu-server/tests/test_ci_shards.py
