# 样例业务包：订单助手（R7 小院试用）。被调用方是 examples/demo-office-api/server.py。
# 配套说明见 docs/guides/writing-packages.md；字段定义见 docs/architecture/package-spec.md。
apiVersion: xuanpu/v1
kind: Package
metadata:
  name: order-desk
  version: 1.0.0
  description: 订单助手：查订单、看哪些没发货、发货统计、标记已发货
spec:
  skills:
    entries: [orders]
  model:
    tier: balanced
  policy:
    approval: standard          # 只读的查询与脚本直接放行，标记发货要人批准
    budget:
      maxSessionTokens: 200000
      maxIterations: 20
  connectors:
    - name: orders
      transport: http
      openapi: apis/orders.yaml
      auth: {type: bearer, secret: office-token}
      timeoutSeconds: 15
      tools:
        - {name: listOrders}
        - {name: getOrder}
        - {name: shippingReport}
        - {name: markShipped, effect: write}
  evals:
    - name: greet
      entry: orders
      input: 你好
      expect:
        contains: ["订单"]
        maxTokens: 4000
