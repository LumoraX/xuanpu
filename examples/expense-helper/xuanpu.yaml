# 样例业务包：报销助手（R7 小院试用）。被调用方是 examples/demo-office-api/server.py。
# 配套说明见 docs/guides/writing-packages.md；字段定义见 docs/architecture/package-spec.md。
apiVersion: xuanpu/v1
kind: Package
metadata:
  name: expense-helper
  version: 1.0.1
  description: 报销助手：按报销制度核对一笔费用能不能报、怎么报，起草并提交报销单
spec:
  skills:
    entries: [claims]
  model:
    tier: balanced
  policy:
    approval: standard          # 查询与核对直接放行，提交报销单要人批准
    budget:
      maxSessionTokens: 200000
      maxIterations: 20
  connectors:
    - name: expenses
      transport: http
      openapi: apis/expenses.yaml
      auth: {type: bearer, secret: office-token}
      timeoutSeconds: 15
      tools:
        - {name: listExpenses}
        - {name: submitClaim, effect: write}
  evals:
    - name: greet
      entry: claims
      input: 你好
      expect:
        contains: ["报销"]
        maxTokens: 4000
