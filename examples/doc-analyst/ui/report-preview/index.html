<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>数据分析结果预览台</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; color: #0f172a; background: #fff; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .meta { font-size: 12px; color: #64748b; margin: 0 0 10px; }
  pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
  <h3>数据分析与 Office 交付预览台</h3>
  <p class="meta" id="status">等待宿主通过安全 Bridge 注入产物摘要…</p>
  <pre id="payload">{}</pre>
  <script>
    window.addEventListener("message", function (ev) {
      var msg = ev.data || {};
      if (msg.type === "xuanpu:init") {
        document.getElementById("status").textContent = "已连接宿主槽位：" + (msg.slot || "artifact-viewer");
        if (msg.artifact && msg.artifact.artifact_id) {
          window.parent.postMessage({
            type: "xuanpu:rpc",
            reqId: "init_read",
            method: "artifact.read",
            params: { artifact_id: msg.artifact.artifact_id }
          }, "*");
        }
      } else if (msg.type === "xuanpu:rpc_result" && msg.reqId === "init_read") {
        document.getElementById("payload").textContent = JSON.stringify(msg.result || msg.error, null, 2);
      }
    });
    window.parent.postMessage({ type: "xuanpu:ready" }, "*");
  </script>
</body>
</html>
