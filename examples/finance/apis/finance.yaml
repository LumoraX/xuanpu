openapi: 3.0.3
info:
  title: 玄圃财务 F0—F4 API
  version: 0.5.0-f4
  description: 独立存储、Skill/API/HITL及通用接口隔离闭环，新增原生通知和运行概览；正式供应商/标准/WORM未验收。
servers:
- url: http://127.0.0.1:8443
security:
- serviceBearer: []
  actorContext: []
x-design-status: implemented-f0-f4-isolated-validated
x-trusted-context: 平台签名注入X-Xuanpu-Context，禁止模型提供身份；executeFinanceAction/reconcileOperation及F2取消只允许cookie人工网关。
paths:
  /v1/finance/legal-entities:
    get:
      operationId: listLegalEntities
      summary: 查询当前主体有权处理的公司
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 授权公司列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/integrations:
    get:
      operationId: listIntegrations
      summary: 查询目标公司已配置通道及真实能力状态
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      responses:
        '200':
          description: 通道状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationList'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoice-imports:
    post:
      operationId: importInvoices
      summary: 归集受权文件的固定版本，持久受理后异步处理
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceImport'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoices:
    get:
      operationId: listInvoices
      summary: 按权限和过滤条件查询发票及独立总数
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: invoice_number
        in: query
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: 发票分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoices/{id}:
    get:
      operationId: getInvoice
      summary: 查询票据金额、正交状态和版本
      x-delivery-phase: F0
      responses:
        '200':
          description: 发票
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/invoices/{id}/lines:
    get:
      operationId: getInvoiceLines
      summary: 有界分页读取票面明细及来源路径
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 明细分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLinePage'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/invoices/{id}/fields:
    get:
      operationId: getInvoiceFields
      summary: 有界分页读取原始字段、路径和标准映射版本
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 字段分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceFieldPage'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/invoices/{id}/evidence:
    get:
      operationId: getInvoiceEvidence
      summary: 查询脱敏证据引用和缺口，不返回原件凭据
      x-delivery-phase: F0
      responses:
        '200':
          description: 证据链
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceBundle'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/expense-claims:
    post:
      operationId: createExpenseClaim
      summary: 创建本人报销草稿，尚不占用发票额度
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseDraft'
      responses:
        '201':
          $ref: '#/components/responses/Document'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listExpenseClaims
      summary: 按当前权限恢复草稿与报销记录
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - submitted
          - under_review
          - approved
          - rejected
          - withdrawn
      responses:
        '200':
          description: 有权单据及独立总数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaimPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/expense-claims/{id}:
    get:
      operationId: getExpenseClaim
      summary: 读取有权查看的报销单及审批版本
      x-delivery-phase: F1
      responses:
        '200':
          $ref: '#/components/responses/Document'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateExpenseClaim
      summary: 以指定版本替换草稿内容，禁止直接改状态
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
      responses:
        '200':
          $ref: '#/components/responses/Document'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/invoice-allocations:
    post:
      operationId: createInvoiceAllocation
      summary: 创建指定草稿的分配建议，提交时才原子占用
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
      responses:
        '201':
          description: 分配建议
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoice-allocations/{id}/release:
    post:
      operationId: releaseInvoiceAllocation
      summary: 移除草稿建议；已保留额度只能经合法撤回或驳回释放
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: 释放结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/review-queue:
    get:
      operationId: listReviewQueue
      summary: 查询当前主体实际有权处理的业务审批步骤
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 审核队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/action-previews:
    post:
      operationId: previewFinanceAction
      summary: 固定目标版本及影响，生成有期限的不可变行动计划
      description: 严格支持F1/F2动作参数矩阵。预检只固定计划；外部动作建立以原摘要为目标的专用审批，不发生付款或记账。
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPreviewRequest'
      responses:
        '201':
          description: 预检计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPlan'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/action-plans/{id}:
    get:
      operationId: getActionPlan
      summary: 读取有权审核或执行的不可变计划及工作流引用
      x-delivery-phase: F1
      responses:
        '200':
          description: 行动计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPlan'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/action-executions:
    post:
      operationId: executeFinanceAction
      summary: 在服务端复核权限、批准、计划、版本和额度后执行
      description: 仅真实员工cookie人工网关调用；员工及批准人当前资格、原计划摘要/版本和专用授权均须有效。202只代表持久受理，不能声称实际资金或凭证成功。模型Skill不声明本工具。
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionExecution'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/operations/{id}:
    get:
      operationId: getOperation
      summary: 查询持久进展、每项结果及实际回执
      x-delivery-phase: F0
      responses:
        '200':
          description: 操作状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/operations/{id}/cancel:
    post:
      operationId: cancelOperation
      summary: 请求取消未发送工作，不能据此认定外部付款已撤销
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/exceptions:
    get:
      operationId: listExceptions
      summary: 查询有权限的异常及独立总数
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 异常分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/exceptions/{id}/resolutions:
    post:
      operationId: resolveException
      summary: 附证据或处置可豁免异常，不能伪造查验和执行结果
      x-delivery-phase: F1
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionResolution'
      responses:
        '200':
          description: 异常最新版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionCase'
        default:
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/Id'
  /v1/finance/payables:
    post:
      operationId: createPayable
      summary: 建立本人应付草稿，固定受控供应商与采购依据
      x-delivery-phase: F2
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayableDraft'
      responses:
        '201':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDocument'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listPayables
      summary: 查询有权应付、状态及过滤后独立总数
      x-delivery-phase: F2
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - submitted
          - under_review
          - approved
          - rejected
          - withdrawn
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayablePage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/payables/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getPayable
      summary: 读取实际应付和独立审批、资金、入账维度
      x-delivery-phase: F2
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDocument'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updatePayable
      summary: 以当前版本完整修订应付草稿，不接收审批结果
      x-delivery-phase: F2
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayableUpdate'
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/payments:
    get:
      operationId: listPayments
      summary: 按单据与权限查询付款明细，total独立于本页
      x-delivery-phase: F2
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: document_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/payments/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getPayment
      summary: 核对父单据权限后读取渠道资金交易回执
      x-delivery-phase: F2
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/postings:
    get:
      operationId: listPostings
      summary: 按单据与权限查询入账及冲回明细，total独立于本页
      x-delivery-phase: F2
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: document_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/postings/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getPosting
      summary: 核对父单据权限后读取渠道账套期间凭证回执
      x-delivery-phase: F2
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posting'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/action-plans:
    get:
      operationId: listActionPlans
      summary: 恢复持久外部行动计划及其专用审批工作流
      x-delivery-phase: F2
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: target_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPlanPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/settlement-options:
    get:
      operationId: getSettlementOptions
      summary: 读取本人经办资格及公司开放期间，不授予执行权限
      x-delivery-phase: F2
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      responses:
        '200':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementOptions'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/operations/{id}/reconcile:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: reconcileOperation
      summary: 请求原请求号只读查单，禁止重新付款或手填成功
      x-delivery-phase: F2
      description: 仅真实员工cookie人工网关可调用；模型工具批准不能代替human来源。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '202':
          description: 受权业务查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoices/{id}/verifications:
    post:
      summary: 受理真实外查，预期版本为合规状态版本。
      description: 受理真实外查，预期版本为合规状态版本。
      operationId: verifyInvoice
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '202':
          description: 受理真实外查，预期版本为合规状态版本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
      x-delivery-phase: F3
    get:
      summary: 读取当前有权票据的实际查验历史。
      description: 读取当前有权票据的实际查验历史。
      operationId: listInvoiceVerifications
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 读取当前有权票据的实际查验历史。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceVerificationPage'
        default:
          $ref: '#/components/responses/Error'
      x-delivery-phase: F3
  /v1/finance/invoices/{id}/compliance:
    get:
      summary: 返回独立合规版本、税务和红冲余额投影。
      description: 返回独立合规版本、税务和红冲余额投影。
      operationId: getInvoiceCompliance
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: 返回独立合规版本、税务和红冲余额投影。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCompliance'
        default:
          $ref: '#/components/responses/Error'
      x-delivery-phase: F3
  /v1/finance/compliance-options:
    get:
      summary: 只展示当前受控政策及经办资格，不返回凭据。
      description: 只展示当前受控政策及经办资格，不返回凭据。
      operationId: getComplianceOptions
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      responses:
        '200':
          description: 只展示当前受控政策及经办资格，不返回凭据。
