openapi: 3.0.3
info:
  title: 玄圃财务 F0 API
  version: 0.1.0-f0.1
  description: 独立财务服务的已实现F0接口。生产格式未验收，synthetic仅测试开发；未接通官方查验、支付、ERP或正式归档。
servers:
- url: http://127.0.0.1:8443
security:
- serviceBearer: []
  actorContext: []
x-design-status: implemented-f0-synthetic-tested
x-trusted-context: X-Xuanpu-Context 由可信平台出口签名注入，不开放给工具参数
paths:
  /v1/finance/legal-entities:
    get:
      operationId: listLegalEntities
      summary: 查询当前主体有权处理的公司
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 授权公司列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/integrations:
    get:
      operationId: listIntegrations
      summary: 查询目标公司已配置通道及真实能力状态
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      responses:
        '200':
          description: 通道状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationList'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoice-imports:
    post:
      operationId: importInvoices
      summary: 归集受权文件的固定版本，持久受理后异步处理
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceImport'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoices:
    get:
      operationId: listInvoices
      summary: 按权限和过滤条件查询发票及独立总数
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: invoice_number
        in: query
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: 发票分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoices/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getInvoice
      summary: 查询票据金额、正交状态和版本
      x-delivery-phase: F0
      responses:
        '200':
          description: 发票
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoices/{id}/lines:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getInvoiceLines
      summary: 有界分页读取票面明细及来源路径
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 明细分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLinePage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoices/{id}/fields:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getInvoiceFields
      summary: 有界分页读取原始字段、路径和标准映射版本
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 字段分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceFieldPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/invoices/{id}/evidence:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getInvoiceEvidence
      summary: 查询脱敏证据引用和缺口，不返回原件凭据
      x-delivery-phase: F0
      responses:
        '200':
          description: 证据链
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceBundle'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/operations/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getOperation
      summary: 查询持久进展、每项结果及实际回执
      x-delivery-phase: F0
      responses:
        '200':
          description: 操作状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/operations/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      operationId: cancelOperation
      summary: 请求取消未发送工作，不能据此认定外部付款已撤销
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Error'
  /v1/finance/exceptions:
    get:
      operationId: listExceptions
      summary: 查询有权限的异常及独立总数
      x-delivery-phase: F0
      parameters:
      - $ref: '#/components/parameters/LegalEntity'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 异常分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionPage'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      description: 独立服务凭据，不能单独代表员工身份
    actorContext:
      type: apiKey
      in: header
      name: X-Xuanpu-Context
      description: 平台签名的请求绑定上下文，由可信出口注入
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    LegalEntity:
      name: legal_entity_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
  responses:
    Error:
      description: 400 格式非法；401 认证失败；403 主体无效；404 不存在或无数据权限；409 版本或幂等冲突；422 业务阻断；503
        授权目录或集成不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Accepted:
      description: 已持久受理，业务结果以操作和领域回执为准
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,15})\.[0-9]{2}$
      example: '1000.00'
    SignedMoney:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,15})\.[0-9]{2}$
      example: '-100.00'
    Version:
      type: integer
      minimum: 1
    Digest:
      type: string
      pattern: ^[a-f0-9]{64}$
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - trace_id
      - retryable
      properties:
        code:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 2000
        trace_id:
          $ref: '#/components/schemas/Id'
        retryable:
          type: boolean
    FileRef:
      type: object
      additionalProperties: false
      required:
      - file_id
      - revision
      - sha256
      properties:
        file_id:
          $ref: '#/components/schemas/Id'
        revision:
          $ref: '#/components/schemas/Version'
        sha256:
          $ref: '#/components/schemas/Digest'
    InvoiceImport:
      type: object
      additionalProperties: false
      required:
      - legal_entity_id
      - files
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Id'
        files:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FileRef'
        source_exception_id:
          $ref: '#/components/schemas/Id'
        expected_exception_version:
          $ref: '#/components/schemas/Version'
      description: 补件时 source_exception_id 与 expected_exception_version 必须同时提供；解析成功提交后关联并关闭原异常，失败保留原待办。
    VersionRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
    EvidenceRef:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - sha256
      - verification_state
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - source
          - verification
          - business
          - approval
          - payment
          - posting
          - archive
          - detection
          - event
        sha256:
          $ref: '#/components/schemas/Digest'
        verification_state:
          type: string
          enum:
          - not_checked
          - verified
          - failed
          - unavailable
        source_version:
          type: string
          maxLength: 128
    EvidenceBundle:
      type: object
      additionalProperties: false
      required:
      - invoice_id
      - evidence
      - gaps
      properties:
        invoice_id:
          $ref: '#/components/schemas/Id'
        evidence:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/EvidenceRef'
        gaps:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 500
    InvoiceLine:
      type: object
      additionalProperties: false
      required:
      - id
      - line_no
      - name
      - amount
      - tax
      properties:
        id:
          $ref: '#/components/schemas/Id'
        line_no:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 1000
        amount:
          $ref: '#/components/schemas/SignedMoney'
        tax:
          $ref: '#/components/schemas/SignedMoney'
        tax_rate:
          type: string
          pattern: ^(0|[1-9][0-9]{0,2})(\.[0-9]{1,6})?$
        source_path:
          type: string
          maxLength: 1000
    Invoice:
      type: object
      additionalProperties: false
      required:
      - id
      - legal_entity_id
      - version
      - number
      - issue_date
      - seller_tax_id
      - buyer_tax_id
      - currency
      - gross
      - tax
      - net
      - line_count
      - is_red
      - parser_profile
      - verification_status
      - ticket_status
      - authority_status
      - posting_status
      - tax_entry_status
      - usage_status
      - archive_status
      - available_amount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        legal_entity_id:
          $ref: '#/components/schemas/Id'
        version:
          $ref: '#/components/schemas/Version'
        number:
          type: string
          minLength: 1
          maxLength: 64
        issue_date:
          type: string
          format: date
        seller_tax_id:
          type: string
          maxLength: 64
        buyer_tax_id:
          type: string
          maxLength: 64
        currency:
          type: string
          enum:
          - CNY
        gross:
          $ref: '#/components/schemas/SignedMoney'
        tax:
          $ref: '#/components/schemas/SignedMoney'
        available_amount:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/SignedMoney'
        line_count:
          type: integer
          minimum: 0
          maximum: 100000
        is_red:
          type: boolean
        parser_profile:
          type: string
          maxLength: 256
        verification_status:
          type: string
          enum:
          - not_checked
          - pending
          - passed
          - failed
          - unavailable
          - stale
        ticket_status:
          type: string
          enum:
          - normal
          - red_locked
          - partially_red
          - fully_red
          - abnormal
        authority_status:
          type: string
          enum:
          - unverified
          - verified
          - stale
        posting_status:
          type: string
          enum:
          - not_posted
          - partially_posted
          - posted
          - partially_reversed
          - reversed
        tax_entry_status:
          type: string
          enum:
          - not_confirmed
          - pending
          - confirmed
          - adjustment_pending
          - adjusted
        usage_status:
          type: string
          enum:
          - not_confirmed
          - pending
          - confirmed
          - adjustment_pending
          - adjusted
        archive_status:
          type: string
          enum:
          - not_archived
          - pending
          - archived
          - exception
    ImportItemResult:
      type: object
      additionalProperties: false
      required:
      - file_id
      - state
      properties:
        file_id:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum:
          - pending
          - received
          - awaiting_original
          - quarantined
          - parsed
          - duplicate_linked
          - failed
          - cancelled
        invoice_id:
          $ref: '#/components/schemas/Id'
        exception_id:
          $ref: '#/components/schemas/Id'
        error_code:
          type: string
          maxLength: 128
    Operation:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - status
      - business_result
      - trace_id
      - items
      - result_refs
      - resources
      description: 导入操作必须返回 summary，pending 包含尚在 received 的项，各分类计数之和等于 total；非导入操作
        items 为空。
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          $ref: '#/components/schemas/Version'
        status:
          type: string
          enum:
          - accepted
          - waiting_approval
          - running
          - dispatching
          - awaiting_provider
          - succeeded
          - failed
          - cancelled
          - outcome_unknown
        business_result:
          type: string
          enum:
          - pending
          - succeeded
          - partial
          - failed
          - cancelled
          - unknown
        trace_id:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportItemResult'
        result_refs:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/EvidenceRef'
        resources:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ResourceRef'
        summary:
          $ref: '#/components/schemas/ImportSummary'
        error:
          $ref: '#/components/schemas/Error'
    ExceptionCase:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - legal_entity_id
      - rule_id
      - severity
      - status
      - evidence
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          $ref: '#/components/schemas/Version'
        legal_entity_id:
          $ref: '#/components/schemas/Id'
        rule_id:
          type: string
          maxLength: 128
        severity:
          type: string
          enum:
          - hard_block
          - policy_block
          - warning
        status:
          type: string
          enum:
          - open
          - investigating
          - accepted
          - resolved
        evidence:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/EvidenceRef'
    LegalEntity:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - tax_id
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 256
        tax_id:
          type: string
          maxLength: 64
    Integration:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - status
      - capabilities
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - erp
          - payment
          - tax
          - archive
          - approval
        status:
          type: string
          enum:
          - ready
          - unconfigured
          - degraded
          - disabled
        capabilities:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: string
            maxLength: 128
    IntegrationList:
      type: object
      additionalProperties: false
      required:
      - legal_entity_id
      - items
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Integration'
    ResourceRef:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - invoice
          - expense_claim
          - payable
          - payment
          - posting
          - red_letter_case
          - archive
          - exception
        id:
          $ref: '#/components/schemas/Id'
    ImportSummary:
      type: object
      additionalProperties: false
      required:
      - total
      - pending
      - parsed
      - duplicate_linked
      - awaiting_original
      - quarantined
      - failed
      - cancelled
      properties:
        total:
          type: integer
          minimum: 1
          maximum: 100
        pending:
          type: integer
          minimum: 0
          maximum: 100
        parsed:
          type: integer
          minimum: 0
          maximum: 100
        duplicate_linked:
          type: integer
          minimum: 0
          maximum: 100
        awaiting_original:
          type: integer
          minimum: 0
          maximum: 100
        quarantined:
          type: integer
          minimum: 0
          maximum: 100
        failed:
          type: integer
          minimum: 0
          maximum: 100
        cancelled:
          type: integer
          minimum: 0
          maximum: 100
    InvoiceField:
      type: object
      additionalProperties: false
      required:
      - name
      - raw_value
      - normalized_value
      - source_path
      - source_receipt_id
      - data_type
      - mapping_state
      properties:
        name:
          type: string
          maxLength: 256
        raw_value:
          type: string
          maxLength: 2000
        normalized_value:
          type: string
          maxLength: 2000
        source_path:
          type: string
          maxLength: 1000
        source_receipt_id:
          $ref: '#/components/schemas/Id'
        data_type:
          type: string
          enum:
          - string
          - decimal
          - date
          - enum
          - boolean
        mapping_state:
          type: string
          enum:
          - unverified
          - standard_mapped
          - extension
        standard_id:
          type: string
          maxLength: 128
        standard_version:
          type: string
          maxLength: 128
        element_id:
          type: string
          maxLength: 256
    InvoiceLinePage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/InvoiceLine'
        total:
          type: integer
          minimum: 0
        next_cursor:
          type: string
          nullable: true
    InvoiceFieldPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/InvoiceField'
        total:
          type: integer
          minimum: 0
        next_cursor:
          type: string
          nullable: true
    LegalEntityPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LegalEntity'
        total:
          type: integer
          minimum: 0
        next_cursor:
          type: string
          nullable: true
    InvoicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Invoice'
        total:
          type: integer
          minimum: 0
        next_cursor:
          type: string
          nullable: true
    ExceptionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExceptionCase'
        total:
          type: integer
          minimum: 0
        next_cursor:
          type: string
          nullable: true
