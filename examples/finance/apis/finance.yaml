components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      description: 独立服务凭据，不能单独代表员工身份
    actorContext:
      type: apiKey
      in: header
      name: X-Xuanpu-Context
      description: 平台签名的请求绑定上下文，由可信出口注入
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    LegalEntity:
      name: legal_entity_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
  responses:
    Error:
      description: 400 格式非法；401 认证失败；403 主体无效；404 不存在或无数据权限；409 版本或幂等冲突；422 业务阻断；503 授权目录或集成不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Accepted:
      description: 已持久受理，业务结果以操作和领域回执为准
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    Document:
      description: 业务单据快照
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessDocument'
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,15})\.[0-9]{2}$
      example: '1000.00'
    SignedMoney:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,15})\.[0-9]{2}$
      example: '-100.00'
    Version:
      type: integer
      minimum: 1
    Digest:
      type: string
      pattern: ^[a-f0-9]{64}$
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - trace_id
      - retryable
      properties:
        code:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 2000
        trace_id:
          $ref: '#/components/schemas/Id'
        retryable:
          type: boolean
    FileRef:
      type: object
      additionalProperties: false
      required:
      - file_id
      - revision
      - sha256
      properties:
        file_id:
          $ref: '#/components/schemas/Id'
        revision:
          $ref: '#/components/schemas/Version'
        sha256:
          $ref: '#/components/schemas/Digest'
    InvoiceImport:
      description: 补件时 source_exception_id 与 expected_exception_version 必须同时提供；成功解析同事务关联关闭原异常，失败保留待办。
      type: object
      additionalProperties: false
      required:
      - legal_entity_id
      - files
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Id'
        files:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FileRef'
        source_exception_id:
          $ref: '#/components/schemas/Id'
        expected_exception_version:
          $ref: '#/components/schemas/Version'
    VersionRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
    EvidenceRef:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - sha256
      - verification_state
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - source
          - verification
          - business
          - approval
          - payment
          - posting
          - archive
          - detection
          - event
        sha256:
          $ref: '#/components/schemas/Digest'
        verification_state:
          type: string
          enum:
          - not_checked
          - verified
          - failed
          - unavailable
        source_version:
          type: string
          maxLength: 128
    EvidenceBundle:
      type: object
      additionalProperties: false
      required:
      - invoice_id
      - evidence
      - gaps
      properties:
        invoice_id:
          $ref: '#/components/schemas/Id'
        evidence:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/EvidenceRef'
        gaps:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 500
    InvoiceLine:
      type: object
      additionalProperties: false
      required:
      - id
      - line_no
      - name
      - amount
      - tax
      properties:
        id:
          $ref: '#/components/schemas/Id'
        line_no:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 1000
        amount:
          $ref: '#/components/schemas/SignedMoney'
        tax:
          $ref: '#/components/schemas/SignedMoney'
        tax_rate:
          type: string
          pattern: ^(0|[1-9][0-9]{0,2})(\.[0-9]{1,6})?$
        source_path:
          type: string
          maxLength: 1000
    Invoice:
      type: object
      additionalProperties: false
      required:
      - id
      - legal_entity_id
      - version
      - number
      - issue_date
      - seller_tax_id
      - buyer_tax_id
      - currency
      - gross
      - tax
      - net
      - line_count
      - is_red
      - parser_profile
      - verification_status
      - ticket_status
      - authority_status
      - posting_status
      - tax_entry_status
      - usage_status
      - archive_status
      - available_amount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        legal_entity_id:
          $ref: '#/components/schemas/Id'
        version:
          $ref: '#/components/schemas/Version'
        number:
          type: string
          minLength: 1
          maxLength: 64
        issue_date:
          type: string
          format: date
        seller_tax_id:
          type: string
          maxLength: 64
        buyer_tax_id:
          type: string
          maxLength: 64
        currency:
          type: string
          enum:
          - CNY
        gross:
          $ref: '#/components/schemas/SignedMoney'
        tax:
          $ref: '#/components/schemas/SignedMoney'
        available_amount:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/SignedMoney'
        line_count:
          type: integer
          minimum: 0
          maximum: 100000
        is_red:
          type: boolean
        parser_profile:
          type: string
          maxLength: 256
        verification_status:
          type: string
          enum:
          - not_checked
          - pending
          - passed
          - failed
          - unavailable
          - stale
        ticket_status:
          type: string
          enum:
          - normal
          - red_locked
          - partially_red
          - fully_red
          - abnormal
        authority_status:
          type: string
          enum:
          - unverified
          - verified
          - stale
        posting_status:
          type: string
          enum:
          - not_posted
          - partially_posted
          - posted
          - partially_reversed
          - reversed
        tax_entry_status:
          type: string
          enum:
          - not_confirmed
          - pending
          - confirmed
          - adjustment_pending
          - adjusted
        usage_status:
          type: string
          enum:
          - not_confirmed
          - pending
          - confirmed
          - adjustment_pending
          - adjusted
        archive_status:
          type: string
          enum:
          - not_archived
          - pending
          - archived
          - exception
          - supplement_required
        effective_gross: &id001
          $ref: '#/components/schemas/Money'
        effective_tax: *id001
        issued_red_amount: *id001
        issued_red_tax: *id001
        available_tax: *id001
        allocation_shortfall: &id002
          type: boolean
        allocation_frozen: *id002
        compliance_status: &id007
          type: string
        compliance_version: &id006
          $ref: '#/components/schemas/Version'
        authority_revision:
          type: integer
          minimum: 0
        verification_evidence:
          type: object
          nullable: true
        source_simulation: *id002
        simulation: *id002
    ExpenseLine:
      type: object
      additionalProperties: false
      required:
      - category_id
      - amount
      - occurred_on
      - reason
      properties:
        category_id:
          $ref: '#/components/schemas/Id'
        amount:
          $ref: '#/components/schemas/Money'
        occurred_on:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        department_id:
          $ref: '#/components/schemas/Id'
        project_id:
          $ref: '#/components/schemas/Id'
    ExpenseDraft:
      type: object
      additionalProperties: false
      required:
      - legal_entity_id
      - reason
      - lines
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
          minLength: 1
