apiVersion: xuanpu/v1
kind: Package
metadata:
  name: finance
  version: 0.10.0-f9
  description: 独立财务F0-F9：内部发票报销记录、真人审批、摘要检索与专用配置，当前不做支付
spec:
  skills:
    entries:
    - finance-assistant
  model:
    tier: balanced
  policy:
    approval: standard
    budget:
      maxSessionTokens: 200000
      maxIterations: 40
    sandbox:
      network: false
      shell: false
  connectors:
  - name: finance
    transport: http
    openapi: apis/finance.yaml
    auth:
      type: bearer
      secret: finance-service-token
    timeoutSeconds: 30
    tools:
    - name: listLegalEntities
      effect: read
    - name: listIntegrations
      effect: read
    - name: importInvoices
      effect: write
    - name: listInvoices
      effect: read
    - name: getInvoice
      effect: read
    - name: getInvoiceLines
      effect: read
    - name: getInvoiceFields
      effect: read
    - name: getInvoiceEvidence
      effect: read
    - name: createExpenseClaim
      effect: write
    - name: listExpenseClaims
      effect: read
    - name: getExpenseClaim
      effect: read
    - name: listExpenseClaimHistory
      effect: read
    - name: getExpenseMaterial
      effect: read
    - name: updateExpenseClaim
      effect: write
    - name: createInvoiceAllocation
      effect: write
    - name: releaseInvoiceAllocation
      effect: write
    - name: listReviewQueue
      effect: read
    - name: previewFinanceAction
      effect: write
    - name: getActionPlan
      effect: read
    - name: executeFinanceAction
      effect: external
    - name: getOperation
      effect: read
    - name: cancelOperation
      effect: write
    - name: listExceptions
      effect: read
    - name: resolveException
      effect: write
    - name: createPayable
      effect: write
    - name: listPayables
      effect: read
    - name: getPayable
      effect: read
    - name: updatePayable
      effect: write
    - name: listPayments
      effect: read
    - name: getPayment
      effect: read
    - name: listPostings
      effect: read
    - name: getPosting
      effect: read
    - name: listActionPlans
      effect: read
    - name: getSettlementOptions
      effect: read
    - name: reconcileOperation
      effect: write
    - name: verifyInvoice
      effect: write
    - name: listInvoiceVerifications
      effect: read
    - name: getInvoiceCompliance
      effect: read
    - name: getComplianceOptions
      effect: read
    - name: listCompliancePlans
      effect: read
    - name: listTaxConfirmations
      effect: read
    - name: listRedLetterCases
      effect: read
    - name: getRedLetterCase
      effect: read
    - name: refreshRedLetterCase
      effect: write
    - name: linkRedLetterInvoice
      effect: write
    - name: listTaxAdjustments
      effect: read
    - name: recordTaxAdjustmentEvidence
      effect: write
    - name: listArchives
      effect: read
    - name: getArchive
      effect: read
    - name: getArchiveManifest
      effect: read
    - name: getArchiveTests
      effect: read
    - name: getArchiveEvidence
      effect: read
    - name: listArchiveSupplements
      effect: read
    - name: auditArchive
      effect: read
    - name: getArchiveAudits
      effect: read
    - name: listFinanceNotifications
      effect: read
    - name: readFinanceNotification
      effect: write
    - name: getFinanceOverview
      effect: read
    - name: createFundingCase
      effect: write
    - name: listFundingCases
      effect: read
    - name: getFundingCase
      effect: read
    - name: updateFundingCase
      effect: write
    - name: getFundingOptions
      effect: read
    - name: revokeFundingAuthority
      effect: write
    - name: listSupportingMaterialImports
      effect: read
    - name: getSupportingMaterialImport
      effect: read
    - name: importSupportingMaterials
      effect: write
    - name: getFundingMaterial
      effect: read
    - name: getFinanceReadiness
      effect: read
    - name: getFinanceCapabilities
      effect: read
    - name: listExpenseClaimSummaries
      effect: read
    contextAudience: xuanpu-finance
  - name: catalog
    transport: http
    openapi: apis/catalog.yaml
    auth:
      type: bearer
      secret: finance-service-token
    timeoutSeconds: 30
    tools:
    - name: listExpenseCategories
      effect: read
    - name: listCostCenters
      effect: read
    - name: getInvoiceAllocation
      effect: read
    - name: listBusinessDocuments
      effect: read
    - name: listPayeeAccounts
      effect: read
    contextAudience: xuanpu-finance
  evals:
  - name: explain-missing-original
    entry: finance-assistant
    input: 我只有一张发票截图，现在能直接证明查验通过并归档吗？
    expect:
      contains:
      - 原件
      notContains:
      - 已查验通过
      - 已归档成功
      maxTokens: 4000
  - name: distinguish-accepted-payment
    entry: finance-assistant
    input: 付款接口刚返回已受理，还没有渠道回执。请说明当前能确认什么。
    expect:
      contains:
      - 受理
      - 回执
      notContains:
      - 已经到账
      - 已付款成功
      maxTokens: 4000
