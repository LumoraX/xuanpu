openapi: 3.0.3
info:
  title: 玄圃财务业务 API 设计契约
  version: 0.1.0-design.1
  description: |
    完整闭环设计契约；已实现的 F0 子集发布于 examples/finance，其余阶段尚未实现。
    本设计包服务器地址为保留域名，不能据此声称全部接口可执行。
    全部接口验证服务身份及平台签名上下文，身份不由模型参数传入。
    每项 x-delivery-phase 指定首次交付阶段。所有写接口要求 Idempotency-Key。
    金额为 CNY 两位小数字符串；业务动作必须通过预检、实际业务批准和执行资格校验。
servers:
  - url: https://finance.invalid
security:
  - serviceBearer: []
    actorContext: []
x-design-status: approved-reference-f0-subset-implemented
x-trusted-context: X-Xuanpu-Context 由可信平台出口签名注入，不开放给工具参数
paths:
  /v1/finance/legal-entities:
    get:
      operationId: listLegalEntities
      summary: 查询当前主体有权处理的公司
      x-delivery-phase: F0
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: 授权公司列表, content: {application/json: {schema: {$ref: '#/components/schemas/LegalEntityPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/integrations:
    get:
      operationId: listIntegrations
      summary: 查询目标公司已配置通道及真实能力状态
      x-delivery-phase: F0
      parameters: [{$ref: '#/components/parameters/LegalEntity'}]
      responses:
        '200': {description: 通道状态, content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationList'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoice-imports:
    post:
      operationId: importInvoices
      summary: 归集受权文件的固定版本，持久受理后异步处理
      x-delivery-phase: F0
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceImport'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoices:
    get:
      operationId: listInvoices
      summary: 按权限和过滤条件查询发票及独立总数
      x-delivery-phase: F0
      parameters:
        - {$ref: '#/components/parameters/LegalEntity'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: invoice_number, in: query, schema: {type: string, maxLength: 64}}
      responses:
        '200': {description: 发票分页, content: {application/json: {schema: {$ref: '#/components/schemas/InvoicePage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoices/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getInvoice
      summary: 查询票据金额、正交状态和版本
      x-delivery-phase: F0
      responses:
        '200': {description: 发票, content: {application/json: {schema: {$ref: '#/components/schemas/Invoice'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoices/{id}/lines:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getInvoiceLines
      summary: 有界分页读取票面明细及来源路径
      x-delivery-phase: F0
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: 明细分页, content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceLinePage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoices/{id}/fields:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getInvoiceFields
      summary: 有界分页读取原始字段、路径和标准映射版本
      x-delivery-phase: F0
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: 字段分页, content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceFieldPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoices/{id}/evidence:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getInvoiceEvidence
      summary: 查询脱敏证据引用和缺口，不返回原件凭据
      x-delivery-phase: F0
      responses:
        '200': {description: 证据链, content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceBundle'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoices/{id}/verifications:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: verifyInvoice
      summary: 发起真实通道查验，缺通道返回错误
      x-delivery-phase: F3
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VersionRequest'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/expense-claims:
    post:
      operationId: createExpenseClaim
      summary: 创建本人报销草稿，尚不占用发票额度
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExpenseDraft'}}}
      responses:
        '201': {$ref: '#/components/responses/Document'}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/expense-claims/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getExpenseClaim
      summary: 读取有权查看的报销单及审批版本
      x-delivery-phase: F1
      responses:
        '200': {$ref: '#/components/responses/Document'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateExpenseClaim
      summary: 以指定版本替换草稿内容，禁止直接改状态
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExpenseUpdate'}}}
      responses:
        '200': {$ref: '#/components/responses/Document'}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/payables:
    post:
      operationId: createPayable
      summary: 根据真实采购依据创建应付草稿
      x-delivery-phase: F2
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PayableDraft'}}}
      responses:
        '201': {$ref: '#/components/responses/Document'}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/payables/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getPayable
      summary: 查询应付业务、分期计划和匹配依据
      x-delivery-phase: F2
      responses:
        '200': {$ref: '#/components/responses/Document'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updatePayable
      summary: 以版本替换应付草稿内容
      x-delivery-phase: F2
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PayableUpdate'}}}
      responses:
        '200': {$ref: '#/components/responses/Document'}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoice-allocations:
    post:
      operationId: createInvoiceAllocation
      summary: 创建指定草稿的分配建议，提交时才原子占用
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AllocationRequest'}}}
      responses:
        '201': {description: 分配建议, content: {application/json: {schema: {$ref: '#/components/schemas/Allocation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoice-allocations/{id}/release:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: releaseInvoiceAllocation
      summary: 移除草稿建议；已保留额度只能经合法撤回或驳回释放
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VersionRequest'}}}
      responses:
        '200': {description: 释放结果, content: {application/json: {schema: {$ref: '#/components/schemas/Allocation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/review-queue:
    get:
      operationId: listReviewQueue
      summary: 查询当前主体实际有权处理的业务审批步骤
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/LegalEntity'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: 审核队列, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/action-previews:
    post:
      operationId: previewFinanceAction
      summary: 固定目标版本及影响，生成有期限的不可变行动计划
      description: 不付款、不入账、不占票额度。action 的实际阶段取主设计中的 F1—F3 限制；未交付动作返回 action_unavailable。
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActionPreviewRequest'}}}
      responses:
        '201': {description: 预检计划, content: {application/json: {schema: {$ref: '#/components/schemas/ActionPlan'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/action-plans/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getActionPlan
      summary: 读取有权审核或执行的不可变计划及工作流引用
      x-delivery-phase: F1
      responses:
        '200': {description: 行动计划, content: {application/json: {schema: {$ref: '#/components/schemas/ActionPlan'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/action-executions:
    post:
      operationId: executeFinanceAction
      summary: 在服务端复核权限、批准、计划、版本和额度后执行
      description: plan_digest 必须来自原预检；审批操作核实真实审批角色，后续执行要求其专用授权。换 key 不能重复执行同计划。
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActionExecution'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/operations/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getOperation
      summary: 查询持久进展、每项结果及实际回执
      x-delivery-phase: F0
      responses:
        '200': {description: 操作状态, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/operations/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: cancelOperation
      summary: 请求取消未发送工作，不能据此认定外部付款已撤销
      x-delivery-phase: F0
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/VersionRequest'}}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/exceptions:
    get:
      operationId: listExceptions
      summary: 查询有权限的异常及独立总数
      x-delivery-phase: F0
      parameters: [{$ref: '#/components/parameters/LegalEntity'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: 异常分页, content: {application/json: {schema: {$ref: '#/components/schemas/ExceptionPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/exceptions/{id}/resolutions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: resolveException
      summary: 附证据或处置可豁免异常，不能伪造查验和执行结果
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExceptionResolution'}}}
      responses:
        '200': {description: 异常最新版本, content: {application/json: {schema: {$ref: '#/components/schemas/ExceptionCase'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/payments/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getPayment
      summary: 查询付款订单、交易结果和脱敏回单引用
      x-delivery-phase: F2
      responses:
        '200': {description: 付款, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/postings/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getPosting
      summary: 查询真实账套凭证及入账回执
      x-delivery-phase: F2
      responses:
        '200': {description: 入账记录, content: {application/json: {schema: {$ref: '#/components/schemas/Posting'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/red-letter-cases/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getRedLetterCase
      summary: 查询红字确认、权威截止时间与金额影响
      x-delivery-phase: F3
      responses:
        '200': {description: 红冲业务, content: {application/json: {schema: {$ref: '#/components/schemas/RedLetterCase'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/archives/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getArchive
      summary: 查询不可变归档包清册、检测和锁定证据
      x-delivery-phase: F3
      responses:
        '200': {description: 档案, content: {application/json: {schema: {$ref: '#/components/schemas/Archive'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    serviceBearer: {type: http, scheme: bearer, description: 独立服务凭据，不能单独代表员工身份}
    actorContext: {type: apiKey, in: header, name: X-Xuanpu-Context, description: 平台签名的请求绑定上下文，由可信出口注入}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    LegalEntity: {name: legal_entity_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}}
  responses:
    Error:
      description: 400 格式非法；401 认证失败；403 主体无效；404 不存在或无数据权限；409 版本或幂等冲突；422 业务阻断；503 授权目录或集成不可用
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Accepted:
      description: 已持久受理，业务结果以操作和领域回执为准
      content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
    Document:
      description: 业务单据快照
      content: {application/json: {schema: {$ref: '#/components/schemas/BusinessDocument'}}}
  schemas:
    Id: {type: string, minLength: 1, maxLength: 128}
    Money: {type: string, pattern: '^(0|[1-9][0-9]{0,15})\.[0-9]{2}$', example: '1000.00'}
    SignedMoney: {type: string, pattern: '^-?(0|[1-9][0-9]{0,15})\.[0-9]{2}$', example: '-100.00'}
    Version: {type: integer, minimum: 1}
    Digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, trace_id, retryable]
      properties:
        code: {type: string, maxLength: 128}
        message: {type: string, maxLength: 2000}
        trace_id: {$ref: '#/components/schemas/Id'}
        retryable: {type: boolean}
    FileRef:
      type: object
      additionalProperties: false
      required: [file_id, revision, sha256]
      properties:
        file_id: {$ref: '#/components/schemas/Id'}
        revision: {$ref: '#/components/schemas/Version'}
        sha256: {$ref: '#/components/schemas/Digest'}
    InvoiceImport:
      description: 补件时 source_exception_id 与 expected_exception_version 必须同时提供；成功解析同事务关联关闭原异常，失败保留待办。
      type: object
      additionalProperties: false
      required: [legal_entity_id, files]
      properties:
        legal_entity_id: {$ref: '#/components/schemas/Id'}
        files: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/FileRef'}}
        source_exception_id: {$ref: '#/components/schemas/Id'}
        expected_exception_version: {$ref: '#/components/schemas/Version'}
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {$ref: '#/components/schemas/Version'}
    EvidenceRef:
      type: object
      additionalProperties: false
      required: [id, kind, sha256, verification_state]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind: {type: string, enum: [source, verification, business, approval, payment, posting, archive, detection, event]}
        sha256: {$ref: '#/components/schemas/Digest'}
        verification_state: {type: string, enum: [not_checked, verified, failed, unavailable]}
        source_version: {type: string, maxLength: 128}
    EvidenceBundle:
      type: object
      additionalProperties: false
      required: [invoice_id, evidence, gaps]
      properties:
        invoice_id: {$ref: '#/components/schemas/Id'}
        evidence: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/EvidenceRef'}}
        gaps: {type: array, maxItems: 1000, items: {type: string, maxLength: 500}}
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [id, line_no, name, amount, tax]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        line_no: {type: integer, minimum: 1}
        name: {type: string, maxLength: 1000}
        amount: {$ref: '#/components/schemas/SignedMoney'}
        tax: {$ref: '#/components/schemas/SignedMoney'}
        tax_rate: {type: string, pattern: '^(0|[1-9][0-9]{0,2})(\.[0-9]{1,6})?$'}
        source_path: {type: string, maxLength: 1000}
    Invoice:
      type: object
      additionalProperties: false
      required: [id, legal_entity_id, version, number, issue_date, seller_tax_id, buyer_tax_id, currency, gross, tax, net, line_count, is_red, parser_profile, verification_status, ticket_status, authority_status, posting_status, tax_entry_status, usage_status, archive_status, available_amount]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        legal_entity_id: {$ref: '#/components/schemas/Id'}
        version: {$ref: '#/components/schemas/Version'}
        number: {type: string, minLength: 1, maxLength: 64}
        issue_date: {type: string, format: date}
        seller_tax_id: {type: string, maxLength: 64}
        buyer_tax_id: {type: string, maxLength: 64}
        currency: {type: string, enum: [CNY]}
        gross: {$ref: '#/components/schemas/SignedMoney'}
        tax: {$ref: '#/components/schemas/SignedMoney'}
        available_amount: {$ref: '#/components/schemas/Money'}
        net: {$ref: '#/components/schemas/SignedMoney'}
        line_count: {type: integer, minimum: 0, maximum: 100000}
        is_red: {type: boolean}
        parser_profile: {type: string, maxLength: 256}
        verification_status: {type: string, enum: [not_checked, pending, passed, failed, unavailable, stale]}
        ticket_status: {type: string, enum: [normal, red_locked, partially_red, fully_red, abnormal]}
        authority_status: {type: string, enum: [unverified, verified, stale]}
        posting_status: {type: string, enum: [not_posted, partially_posted, posted, partially_reversed, reversed]}
        tax_entry_status: {type: string, enum: [not_confirmed, pending, confirmed, adjustment_pending, adjusted]}
        usage_status: {type: string, enum: [not_confirmed, pending, confirmed, adjustment_pending, adjusted]}
        archive_status: {type: string, enum: [not_archived, pending, archived, exception]}
    ExpenseLine:
      type: object
      additionalProperties: false
      required: [category_id, amount, occurred_on, reason]
      properties:
        category_id: {$ref: '#/components/schemas/Id'}
        amount: {$ref: '#/components/schemas/Money'}
        occurred_on: {type: string, format: date}
        reason: {type: string, minLength: 1, maxLength: 1000}
        department_id: {$ref: '#/components/schemas/Id'}
        project_id: {$ref: '#/components/schemas/Id'}
    ExpenseDraft:
      type: object
      additionalProperties: false
      required: [legal_entity_id, reason, lines]
      properties:
        legal_entity_id: {$ref: '#/components/schemas/Id'}
        reason: {type: string, minLength: 1, maxLength: 2000}
        lines: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/ExpenseLine'}}
    ExpenseUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, draft]
      properties:
        expected_version: {$ref: '#/components/schemas/Version'}
        draft: {$ref: '#/components/schemas/ExpenseDraft'}
    BusinessRef:
      type: object
      additionalProperties: false
      required: [kind, source, id, version, sha256]
      properties:
        kind: {type: string, enum: [contract, order, acceptance, supplier, employee_account, supplier_account]}
        source: {type: string, minLength: 1, maxLength: 128}
        id: {$ref: '#/components/schemas/Id'}
