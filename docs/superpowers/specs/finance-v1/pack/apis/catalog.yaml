openapi: 3.0.3
info:
  title: 玄圃财务受控主数据 API 设计契约
  version: 0.1.0-design.1
  description: 同一财务服务的主数据与分配查询；设计草案，未实现运行服务。所有查询按公司和真实业务权限过滤，不提供账户修改接口。
servers: [{url: https://finance.invalid}]
security: [{serviceBearer: [], actorContext: []}]
x-design-status: awaiting-written-review
paths:
  /v1/finance/catalog/expense-categories:
    get:
      operationId: listExpenseCategories
      summary: 查询已启用费用分类与制度版本
      x-delivery-phase: F1
      parameters: [{$ref: '#/components/parameters/LegalEntity'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: 费用分类分页, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/catalog/cost-centers:
    get:
      operationId: listCostCenters
      summary: 查询当前主体可使用的部门和项目
      x-delivery-phase: F1
      parameters:
        - {$ref: '#/components/parameters/LegalEntity'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: kind, in: query, schema: {type: string, enum: [department, project]}}
      responses:
        '200': {description: 分摊归属分页, content: {application/json: {schema: {$ref: '#/components/schemas/CostCenterPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/catalog/business-documents:
    get:
      operationId: listBusinessDocuments
      summary: 查询真实供应商及合同订单验收的受控快照引用
      x-delivery-phase: F2
      parameters:
        - {$ref: '#/components/parameters/LegalEntity'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: kind, in: query, required: true, schema: {type: string, enum: [supplier, contract, order, acceptance]}}
        - {name: query, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200': {description: 业务资料分页, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessRefPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/catalog/payee-accounts:
    get:
      operationId: listPayeeAccounts
      summary: 仅查询指定单据允许使用的已核实收款账户版本
      x-delivery-phase: F2
      parameters:
        - {$ref: '#/components/parameters/LegalEntity'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: document_kind, in: query, required: true, schema: {type: string, enum: [expense_claim, payable]}}
        - {name: document_id, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
      responses:
        '200': {description: 脱敏账户分页, content: {application/json: {schema: {$ref: '#/components/schemas/PayeePage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/finance/invoice-allocations/{id}:
    parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}]
    get:
      operationId: getInvoiceAllocation
      summary: 同时验证票据和单据权限后读取分配金额及版本
      x-delivery-phase: F1
      responses:
        '200': {description: 分配详情, content: {application/json: {schema: {$ref: '#/components/schemas/Allocation'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    serviceBearer: {type: http, scheme: bearer}
    actorContext: {type: apiKey, in: header, name: X-Xuanpu-Context}
  parameters:
    LegalEntity: {name: legal_entity_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
  responses:
    Error:
      description: 400 格式非法；401 认证失败；403 主体无效；404 不存在或无数据权限；503 目录不可用
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Id: {type: string, minLength: 1, maxLength: 128}
    Money: {type: string, pattern: '^(0|[1-9][0-9]{0,15})\.[0-9]{2}$', example: '1000.00'}
    Version: {type: integer, minimum: 1}
    Digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, trace_id, retryable]
      properties:
        code: {type: string, maxLength: 128}
        message: {type: string, maxLength: 2000}
        trace_id: {$ref: '#/components/schemas/Id'}
        retryable: {type: boolean}
    BusinessRef:
      type: object
      additionalProperties: false
      required: [kind, source, id, version, sha256]
      properties:
        kind: {type: string, enum: [contract, order, acceptance, supplier, employee_account, supplier_account]}
        source: {type: string, minLength: 1, maxLength: 128}
        id: {$ref: '#/components/schemas/Id'}
        version: {type: string, minLength: 1, maxLength: 128}
        sha256: {$ref: '#/components/schemas/Digest'}
    Allocation:
      type: object
      additionalProperties: false
      required: [id, version, invoice_id, document_id, amount, tax, state]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version: {$ref: '#/components/schemas/Version'}
        invoice_id: {$ref: '#/components/schemas/Id'}
        document_id: {$ref: '#/components/schemas/Id'}
        amount: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money'}
        state: {type: string, enum: [proposed, reserved, consumed, released]}
    Category:
      type: object
      additionalProperties: false
      required: [id, name, policy_version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, maxLength: 256}
        policy_version: {$ref: '#/components/schemas/Version'}
    CostCenter:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, maxLength: 256}
        kind: {type: string, enum: [department, project]}
    BusinessSnapshot:
      type: object
      additionalProperties: false
      required: [ref, name, verification_state]
      properties:
        ref: {$ref: '#/components/schemas/BusinessRef'}
        name: {type: string, maxLength: 500}
        verification_state: {type: string, enum: [not_checked, verified, unavailable]}
        amount: {$ref: '#/components/schemas/Money'}
        party_tax_id: {type: string, maxLength: 64}
        counterparty_tax_id: {type: string, maxLength: 64}
        occurred_on: {type: string, format: date}
    PayeeSnapshot:
      type: object
      additionalProperties: false
      required: [ref, account_name, masked_account, verified]
      properties:
        ref: {$ref: '#/components/schemas/BusinessRef'}
        account_name: {type: string, maxLength: 256}
        masked_account: {type: string, maxLength: 64}
        verified: {type: boolean, enum: [true]}
    CategoryPage:
      type: object
      additionalProperties: false
      required: [items, total, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Category'}}
        total: {type: integer, minimum: 0}
        next_cursor: {type: string, nullable: true}
    CostCenterPage:
      type: object
      additionalProperties: false
      required: [items, total, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CostCenter'}}
        total: {type: integer, minimum: 0}
        next_cursor: {type: string, nullable: true}
    BusinessRefPage:
      type: object
      additionalProperties: false
      required: [items, total, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/BusinessSnapshot'}}
        total: {type: integer, minimum: 0}
        next_cursor: {type: string, nullable: true}
    PayeePage:
      type: object
      additionalProperties: false
      required: [items, total, next_cursor]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/PayeeSnapshot'}}
        total: {type: integer, minimum: 0}
        next_cursor: {type: string, nullable: true}
