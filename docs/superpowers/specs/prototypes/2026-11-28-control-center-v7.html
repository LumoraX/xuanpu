<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>玄圃控制中心 · 第七版原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<style>
  body{margin:0;padding:12px;background:var(--background,#fff);color:var(--foreground,#171717);
    font-family:var(--font-sans,system-ui,-apple-system,"PingFang SC",sans-serif);font-size:14px;line-height:1.5}
  .hint{color:var(--muted-foreground,#6b7280);font-size:12px;margin:0 2px 8px}

  /* ---------- 原型自己的固定色板（游戏界面），只在 .xp 内生效 ---------- */
  .xp{--ink:#090c12;--panel:#10161f;--panel2:#161e2a;--line:#283345;--gold:#d8b46a;--gold2:#8f733a;
    --fg:#eef1f5;--mut:#93a0b3;--jade:#5fd0aa;--red:#e5573f;--amber:#f0b24a;
    --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
    container-type:inline-size;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .xp *{box-sizing:border-box}
  .xp button{font:inherit;color:inherit;cursor:pointer}
  .mono{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-variant-numeric:tabular-nums}
  .hidden{display:none!important}
  kbd{font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--mut);background:var(--ink)}

  /* 顶栏 */
  .top{display:flex;align-items:center;gap:12px;padding:9px 14px;background:linear-gradient(180deg,#151c28,#0e141d);border-bottom:1px solid var(--gold2)}
  .brand{font-family:var(--serif);font-size:18px;letter-spacing:.28em;color:var(--gold);font-weight:700;white-space:nowrap}
  .brand::before{content:"◈";margin-right:8px;letter-spacing:0}
  .online{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade);flex:none}
  .pulse{animation:xp-pulse 1.6s ease-in-out infinite}
  @keyframes xp-pulse{50%{opacity:.35}}
  .seg{margin-left:auto;display:flex;border:1px solid var(--gold2);border-radius:8px;padding:2px;background:var(--ink)}
  .seg button{border:0;background:none;padding:4px 16px;border-radius:6px;color:var(--mut);font-family:var(--serif);letter-spacing:.2em;font-size:14px}
  .seg button[aria-pressed=true]{background:linear-gradient(180deg,#e7c988,#b9924a);color:#1b1408;font-weight:700}

  .body{display:block}
  .col{min-width:0}
  /* ---------- 视口：场景 + 叠在上面的界面 ---------- */
  .view{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#1c2636 0,#0b0f17 70%)}
  #act{position:absolute;inset:0;height:100%}
  #env{transition:filter .7s}
  .god #env{filter:saturate(.16) brightness(.46) contrast(1.2)}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(4,6,10,.82) 100%)}
  .scan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s;
    background:repeating-linear-gradient(0deg,rgba(120,190,255,.07) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 46%,rgba(40,110,190,.2),transparent 70%)}
  .god .scan{opacity:1}
  .fly{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe6a3;box-shadow:0 0 6px 2px rgba(255,214,130,.7);pointer-events:none;animation:xp-fly 7s ease-in-out infinite}
  @keyframes xp-fly{0%,100%{transform:translate(0,0);opacity:0}20%{opacity:.9}50%{transform:translate(14px,-22px);opacity:.5}80%{opacity:.9}}
  .god .fly{display:none}
  .bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .5s;pointer-events:none;z-index:3}
  .bars::before{top:0}.bars::after{bottom:0}
  .replaying .bars::before,.replaying .bars::after{height:16px}

  /* 场景内文字与角色 */
  .ch{cursor:pointer}
  .ch .shadow{fill:#000;opacity:.28}
  .ch .ring{fill:none;stroke:var(--c);stroke-width:1.6;opacity:0}
  .god .ch .ring{opacity:.85}
  .ch.sel .ring{opacity:1;stroke:#fff;stroke-dasharray:4 3;stroke-width:1.8}
  .ch.work .bob{animation:xp-bob .45s ease-in-out infinite alternate}
  @keyframes xp-bob{to{transform:translateY(-4px)}}
  .god .ch .art{filter:drop-shadow(0 0 5px var(--c))}
  .god .ch.idle .art{filter:none;opacity:.5}
  .ch.dim{opacity:.25}
  .eyes{display:none}
  [data-face=open] .eyes-open,[data-face=closed] .eyes-closed,[data-face=happy] .eyes-happy,[data-face=dizzy] .eyes-dizzy{display:inline}
  .ch .nm{font-size:9px;text-anchor:middle;fill:#fff;font-weight:700;paint-order:stroke;stroke:#1a1208;stroke-width:3px;stroke-linejoin:round}
  .god .ch .nm{display:none}
  .lnk{fill:none;stroke-width:2.2;stroke-dasharray:6 6;opacity:0;animation:xp-dash 1s linear infinite;filter:drop-shadow(0 0 4px currentColor)}
  @keyframes xp-dash{to{stroke-dashoffset:-24}}
  .god .lnk.on{opacity:.95}
  .lead{stroke-width:1;opacity:.8}
  .lab text{font-size:10.5px}
  .lab .bb{fill:#fff8e6;stroke:#3b2a1a;stroke-width:1.2}
  .lab .bt{fill:#2b1d10;font-weight:600}
  .lab.need .bb{fill:#d8432c;stroke:#ffe1a8} .lab.need .bt{fill:#fff;font-weight:700}
  .lab .pb{fill:#060b14;fill-opacity:.92;stroke-width:1.1}
  .lab .pn{fill:#fff;font-weight:700;font-size:9.5px}
  .lab .pd{fill:#b6c7e2;font-size:9px;font-family:var(--font-mono,ui-monospace,Menlo,monospace)}
  .sign{cursor:default;transition:opacity .5s}
  .god .sign{opacity:.5} .god .sign.data:hover{opacity:1}
  .snap *{transition:none!important}
  .sign rect{fill:#0b1018;fill-opacity:.88;stroke:#55606f;stroke-width:1}
  .sign text{font-size:10px;fill:#c7d0dc;font-weight:600}
  .sign path{fill:none;stroke:#c7d0dc;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sign.data{cursor:pointer}
  .sign.data rect{stroke:var(--gold);stroke-width:1.2;fill:#141006;fill-opacity:.9}
  .sign.data text{fill:#ffe9b8;font-size:11px;font-weight:700}
  .sign.data path{stroke:var(--gold)}
  .sign.data .cnt{fill:var(--gold);font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:10.5px}
  .sign.data:hover rect{fill:#3a2c10}
  .sign .hot{fill:var(--jade);font-size:10px;font-weight:700;font-family:var(--font-mono,ui-monospace,Menlo,monospace)}
  .sign .newdot{fill:var(--red)}
  .flick{animation:xp-flick 3.2s ease-in-out infinite}
  @keyframes xp-flick{0%,100%{opacity:.9}45%{opacity:.7}60%{opacity:1}}

  /* 视口四角的界面 */
  .hud{position:absolute;z-index:2;pointer-events:none}
  .god .bl,.god .br{display:none}
  .hud>*{pointer-events:auto}
  .tl{left:14px;top:14px}
  .tl h2{margin:0;font-family:var(--serif);font-size:19px;letter-spacing:.2em;color:var(--gold);text-shadow:0 2px 10px #000;font-weight:700}
  .tl p{margin:3px 0 0;font-size:12px;color:var(--fg);text-shadow:0 1px 6px #000}
  .tl b{color:var(--jade)} .tl b.need{color:#ff8a70} .tl .rep{color:#ffd166;font-weight:700}
  .tr{right:14px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .eye{border:1px solid var(--gold2);background:rgba(10,14,20,.85);border-radius:8px;padding:3px 12px;font-family:var(--serif);letter-spacing:.18em;color:var(--gold);font-size:14px}
  .god .eye{background:linear-gradient(180deg,#e7c988,#b9924a);color:#1b1408;font-weight:700}
  .cam{display:flex;gap:6px}
  .hbtn{border:1px solid var(--line);background:rgba(10,14,20,.8);border-radius:7px;padding:2px 10px;font-size:12px;color:var(--fg);backdrop-filter:blur(6px)}
  .hbtn.on{border-color:var(--gold);color:var(--gold)}
  .keys{font-size:11px;color:var(--mut);text-shadow:0 1px 4px #000;text-align:right}
  .bl{left:10px;bottom:22px;width:168px}
  .roster{display:flex;flex-direction:column;gap:3px}
  .mem{display:flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:2px 8px 2px 2px;background:rgba(9,13,19,.72);backdrop-filter:blur(6px);text-align:left;width:100%}
  .mem:hover{border-color:var(--line)} .mem.sel{border-color:var(--gold)}
  .mem svg{width:26px;height:26px;flex:none;border-radius:50%;background:#232c3a;box-shadow:0 0 0 2px var(--rc,#4a5567)}
  .mem.s-tool svg{--rc:var(--jade)} .mem.s-think svg{--rc:var(--amber)} .mem.s-wait svg{--rc:var(--red)} .mem.s-err svg{--rc:var(--red)}
  .mem .mn{font-size:11.5px;font-weight:700;line-height:1.2;white-space:nowrap}
  .mem .ms{font-size:10.5px;color:var(--mut);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
  .mem.s-wait .ms{color:#ff8a70;font-weight:700}
  .br{right:10px;bottom:22px;width:min(270px,44%);display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .feed{font-size:11.5px;background:rgba(9,13,19,.72);backdrop-filter:blur(6px);border-right:2px solid var(--c);border-radius:6px 0 0 6px;padding:1px 8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed:nth-last-child(2){opacity:.8}.feed:nth-last-child(3){opacity:.6}.feed:nth-last-child(4){opacity:.4}
  .feed b{color:var(--c)} .feed.err{color:#ff8a70}

  /* 目的地面板（通讯录、项目、待办…） */
  .sheet{position:absolute;z-index:5;right:10px;top:48px;bottom:10px;width:min(340px,calc(100% - 20px));border:1px solid #5ee6ff;border-radius:10px;display:flex;flex-direction:column;
    background:repeating-linear-gradient(0deg,rgba(94,230,255,.05) 0 1px,transparent 1px 3px),rgba(6,18,28,.9);box-shadow:0 0 0 1px rgba(94,230,255,.25),0 0 34px rgba(94,230,255,.28),0 20px 60px #000;backdrop-filter:blur(8px)}
  .sheet.left{right:auto;left:10px}
  .sheet::before,.sheet::after{content:"";position:absolute;width:14px;height:14px;border:2px solid #5ee6ff;pointer-events:none}
  .sheet::before{left:-3px;top:-3px;border-right:0;border-bottom:0}.sheet::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
  .sheet .rows{flex:1}
  .sheet h5{margin:10px 0 4px;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.08em}
  .sheet pre{margin:0;padding:7px 9px;background:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:11px;overflow:auto;max-height:86px;white-space:pre-wrap;word-break:break-all}
  .sheet header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .sheet header svg{width:20px;height:20px;stroke:#5ee6ff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sheet h3{margin:0;font-family:var(--serif);letter-spacing:.2em;color:#bff4ff;font-size:16px;text-shadow:0 0 10px rgba(94,230,255,.7)}
  .sheet header .x{margin-left:auto}
  .tabs{display:flex;gap:4px;padding:8px 12px 0;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:1px 11px;font-size:12px;color:var(--mut)}
  .tabs button.on{border-color:#5ee6ff;color:#5ee6ff}
  .rows{overflow:auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:5px}
  .rw{display:flex;gap:9px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
  .rw .av{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#2a3547;color:var(--gold)}
  .rw .bx{flex:none;width:16px;height:16px;border:1.5px solid var(--mut);border-radius:4px;margin-top:2px}
  .rw .t{font-weight:600;font-size:13px} .rw .s{font-size:11.5px;color:var(--mut)}
  .rw .g{flex:1;min-width:0}
  .bar{height:4px;border-radius:2px;background:#263142;margin-top:5px;overflow:hidden} .bar i{display:block;height:100%;background:var(--gold)}
  .tag{border:1px solid var(--jade);color:var(--jade);border-radius:999px;padding:0 7px;font-size:10.5px;line-height:16px;white-space:nowrap}
  .tag.gold{border-color:var(--gold);color:var(--gold)}

  /* 回放条 */
  .replay{border-top:1px solid var(--gold2);padding:9px 14px 10px;background:linear-gradient(180deg,#131a25,#0d121a)}
  .rctl{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
  .tbtn{border:1px solid var(--line);background:var(--ink);border-radius:7px;padding:2px 9px;font-size:12px;min-width:32px}
  .tbtn.big{border-color:var(--gold);color:var(--gold);min-width:44px;font-size:14px}
  .tbtn.on{border-color:var(--jade);color:var(--jade)}
  .tclock{font-size:16px;font-weight:700;letter-spacing:.05em;color:#ffd166;margin:0 6px}
  .tnote{font-size:11px;color:var(--mut);margin-left:auto}
  .lanes{position:relative;user-select:none;touch-action:none}
  .lane{display:flex;height:16px;align-items:center}
  .lane .who{flex:none;width:104px;font-size:10.5px;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;cursor:pointer}
  .lane .who i{width:7px;height:7px;border-radius:2px;background:var(--c);flex:none}
  .lane.sel .who{color:#fff;font-weight:700}
  .lane .trk{position:relative;flex:1;height:100%;border-bottom:1px solid #1c2533}
  .b{position:absolute;top:4px;height:8px;border-radius:3px;background:var(--c);min-width:3px}
  .b.exec{top:2px;height:12px;background:color-mix(in srgb,var(--c) 20%,transparent)}
  .b.err{background:var(--red);outline:1px solid #fff}
  .b.wait{background:repeating-linear-gradient(135deg,var(--red) 0 3px,transparent 3px 6px);outline:1px dashed var(--red)}
  .b.msg{width:8px;height:8px;border-radius:50%;margin-left:-4px}
  .scrub{position:absolute;left:104px;right:0;top:0;bottom:0;cursor:ew-resize}
  .head{position:absolute;top:-4px;bottom:-2px;width:2px;background:#ffd166;margin-left:-1px;pointer-events:none;box-shadow:0 0 8px #ffd166}
  .head::before{content:"";position:absolute;left:-4px;top:-5px;border:5px solid transparent;border-top-color:#ffd166}
  .ticks{display:flex;justify-content:space-between;margin:3px 0 0 104px;font-size:10px;color:var(--mut)}

  /* 底部：对管家下令（普通）/ 回放（天眼） */
  .cmd{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--gold2);background:linear-gradient(180deg,#151c28,#0d121a);color:var(--mut);font-size:13.5px}
  .cmd b{color:var(--gold);font-family:var(--serif);letter-spacing:.2em;white-space:nowrap}
  .cmd span{flex:1;border:1px solid var(--line);background:var(--ink);border-radius:8px;padding:5px 10px}
  .god .cmd{display:none}
  /* 墙上的屏、沙盘 */
  .scr{cursor:pointer}
  .scr .bz{fill:#05080d;stroke:#000;stroke-width:1}
  .scr .pn2{fill:#08131c;stroke:var(--sc);stroke-width:1.2;filter:drop-shadow(0 0 5px var(--sc))}
  .scr:hover .pn2{fill:#0d2130}
  .scr .hd{fill:var(--sc)}
  .scr .ti{font-size:9.5px;font-weight:800;fill:#0a0f15;letter-spacing:.08em}
  .scr .ct{font-size:11px;font-weight:800;fill:#0a0f15;text-anchor:end;font-family:var(--font-mono,ui-monospace,Menlo,monospace)}
  .scr .ln{font-size:7.6px;fill:#cfe7f1}
  .scr .ln.b{font-weight:700;fill:#fff;font-size:8px} .scr .ln.r{fill:#ff8f78;font-weight:700} .scr .ln.a{fill:var(--sc);font-weight:700} .scr .ln.m{font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:6.6px}
  .scr .big{font-size:20px;font-weight:800;fill:var(--sc);font-family:var(--font-mono,ui-monospace,Menlo,monospace)}
  .scr .av{fill:#1b2c3c;stroke:var(--sc);stroke-width:.8} .scr .al{font-size:7px;fill:#fff;text-anchor:middle;font-weight:700} .scr .an{font-size:6px;fill:#b9cfdb;text-anchor:middle}
  .holo{cursor:pointer}
  .holo .gridp{fill:rgba(94,230,255,.12);stroke:#5ee6ff;stroke-width:1}
  .holo:hover .gridp{fill:rgba(94,230,255,.24)}
  .holo .pl{fill:url(#gPillar);stroke:#5ee6ff;stroke-width:.6}
  .holo .cap{fill:#bff4ff}
  .holo .pt{font-size:7.4px;fill:#eaffff;text-anchor:middle;font-weight:700;paint-order:stroke;stroke:#04121a;stroke-width:2.4px}
  .holo .pp{font-size:6.6px;fill:#5ee6ff;text-anchor:middle;font-family:var(--font-mono,ui-monospace,Menlo,monospace);paint-order:stroke;stroke:#04121a;stroke-width:2.2px}
  .holo .ht{font-size:9.5px;fill:#bff4ff;text-anchor:middle;font-weight:800;letter-spacing:.1em;paint-order:stroke;stroke:#04121a;stroke-width:3px}
  .spin{animation:xp-spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes xp-spin{to{transform:rotate(360deg)}}
  /* 右栏：任务（普通）/ 细节（天眼） */
  .sh{font-family:var(--serif);letter-spacing:.24em;color:var(--gold);font-size:13px;margin:12px 0 6px;display:flex;align-items:center;gap:8px}
  .sh:first-child{margin-top:0}
  .sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold2),transparent)}
  .q{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--qc,var(--line));border-radius:9px;padding:8px 10px;margin-bottom:6px}
  .q.need{--qc:var(--red);background:#2a1512;border-color:#6b2a20;border-left-color:var(--red)}
  .q.run{--qc:var(--jade)} .q.ok{--qc:var(--gold2)} .q.fail{--qc:var(--red)}
  .q[data-actors]:hover{border-color:var(--gold)}
  .q .ask{font-size:11.5px;color:var(--mut);margin:0 0 1px}
  .q .res{margin:0;font-weight:600;font-size:13.5px;text-wrap:pretty}
  .q ul{list-style:none;margin:5px 0 0;padding:0;font-size:12px;color:var(--mut)}
  .q li{display:flex;gap:6px;align-items:baseline}
  .q li::before{content:"✓";color:var(--jade);font-weight:700}
  .q li.cur{color:var(--fg)} .q li.cur::before{content:"▸";color:var(--amber)}
  .q li.me{color:#ff8a70;font-weight:700} .q li.me::before{content:"!";color:#ff8a70}
  .q .meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:5px;font-size:11.5px;color:var(--mut);align-items:center}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 11px;font-size:12.5px}
  .btn.pri{background:linear-gradient(180deg,#e7c988,#b9924a);border-color:#b9924a;color:#1b1408;font-weight:700}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  .acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .who-h{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap}
  .who-h .btn{white-space:nowrap;padding:2px 9px;font-size:12px}
  .who-h svg{width:34px;height:34px;border-radius:50%;background:#232c3a;box-shadow:0 0 0 2px var(--c)}
  .who-h h4{margin:0;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who-h .sp{display:flex;gap:5px;flex-basis:100%;margin-top:4px}
  .sub{font-size:11px;color:var(--mut);margin:2px 0 8px}
  .statebar{border:1px solid var(--c);border-radius:8px;padding:6px 9px;margin-bottom:10px;font-size:12.5px;background:color-mix(in srgb,var(--c) 12%,transparent)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;margin:0 0 8px}
  .kv dt{color:var(--mut)} .kv dd{margin:0;word-break:break-all}
  .quote{margin:0;padding:5px 9px;border-left:3px solid var(--c);background:var(--ink);border-radius:0 6px 6px 0;font-size:12.5px}
  .hist{list-style:none;margin:0;padding:0;font-size:12px}
  .hist li{display:flex;gap:8px;padding:3px 6px;border-radius:6px;cursor:pointer;align-items:baseline}
  .hist li:hover{background:var(--ink)} .hist li.cur{background:#12303a}
