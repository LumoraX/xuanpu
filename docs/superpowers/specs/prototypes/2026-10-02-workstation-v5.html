<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>玄圃工作站</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* v4：每个人只有一个助理（小玄）。报销、出差、请假、工单都是它会的事；
   它直接调系统接口填单，或者去找别的部门交接——对方那边也是助理在接，但界面上不出现，
   你只看到「财务部已受理」这样的进展。中间是和它的对话，右边是待办和事项。数据全是编的。 */
:root {
  --bg: #e9ece8; --bg-2: #d7ddd6;
  --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-2: #eef1ee; --line: #cfd6cf;
  --fg: #1d2420; --muted: #5f6a64;
  --accent: #2f7d6d; --accent-ink: #fff; --accent-soft: #dcebe6;
  --warn: #b9731a; --warn-soft: #fbefdc; --danger: #b4423a; --danger-soft: #f9e4e2; --ok: #2f7d6d; --info: #4f6d9a; --info-soft: #e3e9f3;
  --shadow: 0 12px 40px rgba(20,30,26,.18);
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --serif: "Noto Serif SC", "Songti SC", serif;
  --mono: "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191a; --bg-2: #0f1213; --panel: rgba(29,34,36,.92); --panel-solid: #1d2224; --panel-2: #262c2e; --line: #343c3e;
    --fg: #e6e9e6; --muted: #9aa5a0; --accent: #5fb49f; --accent-ink: #0f1a17; --accent-soft: #1f3330;
    --warn: #e0a24a; --warn-soft: #3a2d18; --danger: #e0756c; --danger-soft: #3d2322; --ok: #5fb49f; --info: #8fa8d0; --info-soft: #23303f;
    --shadow: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191a; --bg-2: #0f1213; --panel: rgba(29,34,36,.92); --panel-solid: #1d2224; --panel-2: #262c2e; --line: #343c3e;
  --fg: #e6e9e6; --muted: #9aa5a0; --accent: #5fb49f; --accent-ink: #0f1a17; --accent-soft: #1f3330;
  --warn: #e0a24a; --warn-soft: #3a2d18; --danger: #e0756c; --danger-soft: #3d2322; --ok: #5fb49f; --info: #8fa8d0; --info-soft: #23303f;
  --shadow: 0 12px 40px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--fg); background: var(--bg); overflow: hidden; }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#desktop { position: fixed; inset: 0; background:
  radial-gradient(1200px 700px at 85% -10%, color-mix(in oklab, var(--accent) 18%, transparent), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 60%),
  linear-gradient(180deg, var(--bg), var(--bg-2)); }
#topbar { position: fixed; top: 0; left: 0; right: 0; height: 34px; padding: 0 14px; padding-top: env(safe-area-inset-top, 0px); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; background: var(--panel); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); z-index: 50; }
#topbar .brand { font-family: var(--serif); font-size: 15px; }
#topbar .status { display: flex; gap: 14px; align-items: center; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); vertical-align: middle; margin-right: 4px; }
.dot.ok { background: var(--ok); } .dot.busy { background: var(--warn); }

/* 三栏 */
#layout { position: fixed; top: 34px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 230px 1fr 320px; gap: 12px; padding: 12px; }
.col { min-width: 0; min-height: 0; display: grid; gap: 10px; align-content: start; }
.box { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.box > .bh { padding: 9px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
.box > .bh h2 { font-size: 13px; }

/* 左：小玄 + 别人的助理 */
.hero { padding: 14px 12px; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; cursor: pointer; }
.hero:hover { background: color-mix(in oklab, var(--panel-solid) 60%, transparent); border-radius: 12px; }
.av { border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); color: #fff; flex: none; }
.hero .nm { font-weight: 600; font-size: 15px; }
.hero .rl { font-size: 12px; color: var(--muted); }
.abil { padding: 4px 12px 10px; display: flex; flex-wrap: wrap; gap: 4px; }
.abil span { font-size: 11px; background: var(--panel-2); border-radius: 9px; padding: 1px 8px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.person { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; border-top: 1px solid var(--line); }
.person:hover { background: var(--panel-2); }
.person .nm { font-weight: 500; line-height: 1.2; font-size: 13px; }
.person .rl { font-size: 11px; color: var(--muted); }
.person .st { font-size: 11px; color: var(--warn); }

/* 中：和小玄的对话 */
#main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
#msgs { overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.m { max-width: 64ch; }
.m.user { align-self: flex-end; background: var(--accent-soft); border-radius: 12px 12px 2px 12px; padding: 7px 11px; }
.m.them { align-self: flex-start; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px 12px 12px 2px; padding: 8px 12px; }
.m.event { align-self: flex-start; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.m.event::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: none; }
.m.event.ok::before { background: var(--ok); } .m.event.warn::before { background: var(--warn); } .m.event.peer::before { background: var(--info); }
.m.day { align-self: center; font-size: 11px; color: var(--muted); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--panel-solid); display: grid; gap: 7px; max-width: 64ch; align-self: flex-start; }
.card.approval { border-color: var(--warn); }
.card.peer { border-left: 3px solid var(--info); }
.card.files { grid-template-columns: repeat(3, auto); justify-content: start; }
.fi { width: 34px; height: 42px; border: 1.5px solid var(--muted); border-radius: 3px; display: grid; place-items: end center; font-size: 9px; color: var(--muted); padding-bottom: 3px; }
.fitem { display: grid; justify-items: center; gap: 3px; font-size: 11px; text-align: center; max-width: 70px; }
.kv { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border-radius: 6px; padding: 7px 9px; white-space: pre-wrap; word-break: break-word; }
.pill { display: inline-block; font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 9px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.ask { background: var(--danger-soft); color: var(--danger); } .pill.busy { background: var(--warn-soft); color: var(--warn); } .pill.ok { background: var(--accent-soft); color: var(--ok); } .pill.info { background: var(--info-soft); color: var(--info); }
.pill.read { background: var(--accent-soft); color: var(--accent); } .pill.write { background: var(--warn-soft); color: var(--warn); } .pill.external { background: var(--danger-soft); color: var(--danger); }
#composer { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; }
#composer form { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
#composer .pfx { font-family: var(--serif); color: var(--accent); font-size: 16px; padding-left: 4px; }
#composer input { border: 0; background: transparent; font-size: 15px; padding: 6px 4px; width: 100%; color: var(--fg); }
#composer input:focus-visible { outline: none; }
#hints { display: flex; gap: 6px; flex-wrap: wrap; }
#hints button { border: 1px solid var(--line); background: transparent; border-radius: 12px; font-size: 12px; padding: 2px 10px; color: var(--muted); cursor: pointer; }
#hints button:hover { color: var(--fg); background: var(--panel-2); }
.cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
.btn { border: 1px solid var(--line); background: var(--panel-solid); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .sp { justify-content: space-between; }
input[type=text], textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-solid); color: var(--fg); padding: 7px 10px; font: inherit; }
input:focus-visible, textarea:focus-visible, .btn:focus-visible, .person:focus-visible, .todo:focus-visible, .matter:focus-visible, #hints button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.f { display: block; margin-bottom: 10px; } label.f span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 10px; cursor: pointer; } .seg button.on { background: var(--accent); color: var(--accent-ink); }

/* 右：日程、待办、事项 */
.daybar { display: flex; gap: 4px; padding: 8px 12px 4px; }
.daybar button { flex: 1; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 3px 0; font-size: 11px; cursor: pointer; color: var(--muted); display: grid; justify-items: center; line-height: 1.2; }
.daybar button b { font-size: 13px; font-weight: 500; color: var(--fg); }
.daybar button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .daybar button.on b { color: var(--accent-ink); }
.daybar button i { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); margin-top: 2px; }
.sched { list-style: none; margin: 0; padding: 4px 0 6px; }
.sched li { display: grid; grid-template-columns: 52px 3px 1fr; gap: 8px; padding: 5px 12px; font-size: 12px; align-items: stretch; }
.sched li time { color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.sched li i { border-radius: 2px; background: var(--line); }
.sched li.cal i { background: var(--accent); } .sched li.remind i { background: var(--info); } .sched li.task i { background: var(--warn); } .sched li.due i { background: var(--danger); } .sched li.free i { background: transparent; }
.sched li .t { line-height: 1.3; } .sched li .s { color: var(--muted); font-size: 11px; }
.sched li.free { color: var(--muted); font-style: normal; }

.todo, .matter { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: start; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; border-top: 1px solid var(--line); font-size: 13px; }
.todo:hover, .matter:hover { background: var(--panel-2); }
.todo i, .matter i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--line); }
.todo.ask i { background: var(--danger); } .todo.remind i { background: var(--info); } .todo.out i { background: var(--warn); } .todo.done i { background: var(--ok); }
.todo .t, .matter .t { line-height: 1.3; } .todo .s, .matter .s { font-size: 11px; color: var(--muted); }
.todo time { font-size: 11px; color: var(--muted); white-space: nowrap; }
.todo.done .t { text-decoration: line-through; color: var(--muted); }
.legend { padding: 6px 12px; display: flex; gap: 10px; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; }

/* 窗口 */
.win { position: fixed; min-width: 320px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr; overflow: hidden; z-index: 30; max-width: calc(100vw - 24px); max-height: calc(100vh - 80px); }
.win.focus { z-index: 40; border-color: color-mix(in oklab, var(--accent) 50%, var(--line)); }
.win .bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); cursor: grab; user-select: none; }
.win .bar .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.win .bar .s { font-size: 11px; color: var(--muted); }
.win .bar button { width: 22px; height: 22px; border-radius: 6px; border: 0; background: none; cursor: pointer; color: var(--muted); }
.win .bar button:hover { background: var(--line); color: var(--fg); }
.win .body { overflow: auto; min-height: 0; }
.pad { padding: 12px 14px; }
.tl { list-style: none; margin: 0; padding: 0 14px 12px; }
.tl li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.tl time { font-size: 12px; color: var(--muted); }
.sec { padding: 10px 14px 4px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; padding: 8px 14px 12px; }
.file { border: 0; background: none; border-radius: 8px; padding: 6px 2px; display: grid; justify-items: center; gap: 4px; font-size: 11px; cursor: pointer; text-align: center; }
.file:hover { background: var(--panel-2); } .file .n { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast { position: fixed; top: calc(44px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 7px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99; }
.toast.show { opacity: 1; }
@media (max-width: 900px) { #layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } #left, #right { max-height: 220px; overflow: auto; } .win { left: 8px !important; top: 44px !important; width: calc(100vw - 16px) !important; height: calc(100vh - 60px) !important; } }
</style>
</head>
<body>
<div id="desktop" aria-hidden="true"></div>
<header id="topbar">
  <div class="row"><span class="brand">玄圃</span><span class="muted">Acme · 张伟</span><span class="muted">示意稿 v5</span></div>
  <div class="status"><span><i class="dot ok"></i>飞书</span><span><i class="dot ok"></i>Gmail</span><span id="st-ask"><i class="dot busy"></i>等你确认 1</span><span class="num" id="clock">09:41</span></div>
</header>

<div id="layout">
  <div class="col" id="left">
    <div class="box">
      <div class="hero" id="hero"><span class="av" style="width:44px;height:44px;background:var(--accent);font-size:18px">玄</span><div><div class="nm" id="my-name">小玄</div><div class="rl">你的助理 · 以你的身份工作</div></div></div>
      <div class="abil" id="abil"></div>
      <div class="bh"><span>它可以直接做的</span><button class="btn sm" id="btn-settings">设置</button></div>
      <div class="pad muted" style="font-size:12px;padding-top:8px">读取、起草、算账不问你；提交、付款、对外发消息总要你确认。管理员定上限，你在上限内调。</div>
    </div>
    <div class="box">
      <div class="bh"><h2>我的</h2></div>
      <ul class="list"><li><button class="person" id="btn-files-left"><span class="av" style="width:30px;height:30px;background:var(--accent-soft);color:var(--accent);font-size:13px">文</span><span><div class="nm">我的文件</div><div class="rl">2.3 / 10 GB</div></span></button></li>
      <li><button class="person" id="btn-skills"><span class="av" style="width:30px;height:30px;background:var(--accent-soft);color:var(--accent);font-size:13px">技</span><span><div class="nm">我的 skill</div><div class="rl">3 个，只对你生效</div></span></button></li></ul>
    </div>
  </div>

  <div class="box" id="main">
    <div id="msgs"></div>
    <div id="composer">
      <form id="shellform"><span class="pfx">›</span><input type="text" id="shellin" placeholder="跟小玄说：把发票报了 / 下周二去上海出差 / 提醒我周五交周报 / 每周一汇总工单" autocomplete="off"><button class="btn primary sm" type="submit">发送</button></form>
      <div id="hints"><button data-say="把我文件里那三张发票报了">把三张发票报了</button><button data-say="下周二去上海出差两天">下周二去上海出差两天</button><button data-say="周五请一天年假">周五请一天年假</button><button data-say="提醒我周五下午交周报">提醒我周五交周报</button><button data-say="明天下午约小李开个会">明天下午约小李开会</button><button data-say="每周一早上把上周的工单汇总给我">每周一汇总工单</button><button data-say="C-42 的工单怎么样了">C-42 的工单</button></div>
    </div>
  </div>

  <div class="col" id="right" style="overflow:auto">
    <div class="box">
      <div class="bh"><h2>日程</h2><span class="muted" id="sched-sub">飞书日历 + 待办 + 定时</span></div>
      <div class="daybar" id="daybar"></div>
      <ul class="sched" id="sched"></ul>
    </div>
    <div class="box">
      <div class="bh"><h2>待办</h2><span class="muted" id="todo-sub"></span></div>
      <div class="legend"><span><i style="background:var(--danger)"></i>要你确认</span><span><i style="background:var(--info)"></i>你让它记的</span><span><i style="background:var(--warn)"></i>交出去的</span></div>
      <ul class="list" id="todos"></ul>
    </div>
    <div class="box">
      <div class="bh"><h2>我的事项</h2><button class="btn sm" id="btn-files">我的文件</button></div>
      <ul class="list" id="mlist"></ul>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  let toastTimer; const toast = (t) => { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove("show"), 1800); };
  (function clock() { const d = new Date(); $("clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); setTimeout(clock, 30000); })();

  const me = { name: "小玄", gender: "女", callme: "张伟", style: "简洁" };
  const abilities = [["报销", "报销系统"], ["出差", "差旅系统、飞书日历"], ["请假", "飞书审批"], ["周报", "你的 skill"], ["工单", "工单系统"], ["找人", "飞书消息，需确认"], ["提醒与定时", "到点替你做"]];
  $("abil").innerHTML = abilities.map(a => `<span title="${esc(a[1])}">${esc(a[0])}</span>`).join("");

  // 别的部门那边也是助理在接，但界面上只显示「某部门 · 进展」
  function dept(name, text) { say("event peer", `${esc(name)} · ${esc(text)}`); }

  // 日程：飞书日历的日程 + 有时间的待办 + 定时任务 + 事项的截止，合在一条时间线上。平台不建日历，日程读自飞书。
  const days = [["周三", "10/2", true], ["周四", "10/3"], ["周五", "10/4"], ["周六", "10/5"], ["周日", "10/6"], ["周一", "10/7"], ["周二", "10/8"]];

        <label class="f"><span>说话风格</span><div class="seg" id="s-style">${["简洁", "详细"].map(g => `<button type="button" class="${me.style === g ? "on" : ""}">${g}</button>`).join("")}</div></label>
        <label class="f"><span>它不用问我就能做的（管理员允许的范围内）</span><div class="row"><span class="pill ok">读取 ✓</span><span class="pill ok">起草 ✓</span><span class="pill ok">算账 ✓</span><span class="pill ok">改我的日历、约会议 ✓</span><span class="pill">提交、付款、对外发消息：总要问我</span></div></label>
        <label class="f"><span>它会用的个人 skill</span><div class="row"><span class="pill ok">me.weekly-report</span><span class="pill ok">me.customer-tiering</span><span class="pill">me.expense-notes</span></div></label>
        <button class="btn primary sm" id="s-save">保存</button></div>`;
      body.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { seg.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); })));
      $("s-save").addEventListener("click", () => { me.name = $("s-name").value.trim() || me.name; me.callme = $("s-callme").value.trim() || me.callme; me.gender = body.querySelector("#s-gender .on").textContent; me.style = body.querySelector("#s-style .on").textContent; $("my-name").textContent = me.name; toast("已保存，只对你生效"); });
    });
  }
  function openSkills() { openWin("skills", "我的 skill", "存在我的空间 /skills/，只对你生效", 460, 300, (body) => { body.innerHTML = `<ul class="tl" style="padding-top:8px"><li><time>周三</time><span>me.weekly-report<div class="muted" style="font-size:12px">按我们组的格式写周报</div></span></li><li><time>上周</time><span>me.customer-tiering<div class="muted" style="font-size:12px">客户按年采购额和回款分 A/B/C</div></span></li><li><time>上月</time><span>me.expense-notes<div class="muted" style="font-size:12px">报销备注怎么写才一次过</div></span></li></ul><div class="pad row"><button class="btn primary sm">新建</button><span class="muted" style="font-size:12px">小玄办事时会按需用上它们</span></div>`; }); }
  $("btn-settings").addEventListener("click", openSettings); $("hero").addEventListener("click", openSettings); $("btn-files").addEventListener("click", openFiles); $("btn-files-left").addEventListener("click", openFiles); $("btn-skills").addEventListener("click", openSkills);

  // 开场：昨晚到现在
  renderTodos(); renderMatters(); renderSched();
  say("day", "昨天");
  say("user", "这三张发票帮我报了");
  say("event ok", "报销系统 · 起草 BX-2311 · 写，放行");
  say("them", "填好了，¥1,280，你确认提交。");
  say("event ok", "你确认 · 报销系统 · 提交 · 审计 #70");
  say("event peer", "财务部 · 已受理 BX-2311，排在今天的批次");
  say("day", "今天");
  say("them", `早上好，${me.callme}。你不在的时候：周报草稿按定时任务生成了，你 8:03 确认后发给了李总；邮件里有 3 封要回的，草稿在「邮件草稿」。上海的机票还在等你选。<div class="row" style="margin-top:6px"><button class="btn sm" data-matter="m2">出差 · 上海</button><button class="btn sm" data-matter="m1">9 月报销</button></div>`);
  $("shellin").focus();
})();
</script>
