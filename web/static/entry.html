<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玄圃</title>
<link rel="stylesheet" href="entry.css?v=57b1e69b1de26738">
<link rel="stylesheet" href="courtyard.css?v=2b3a8f9fa52fd24b">
</head>
<body class="unauthenticated">
<section id="entry-auth-gate" class="auth-gate" aria-label="登录玄圃">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-seal" aria-hidden="true">玄</span>
      <div>
        <h1>玄圃</h1>
        <p class="auth-subtitle">企业智能协作与数字匠人工作台</p>
      </div>
    </div>
    <p id="entry-login-error" class="entry-error hidden" role="alert"></p>
    <form id="entry-password-form" class="auth-form">
      <label class="auth-field">
        <span>用户名</span>
        <input aria-label="用户名" id="entry-username" autocomplete="username" placeholder="请输入用户名" required maxlength="64">
      </label>
      <label class="auth-field">
        <span>口令</span>
        <input aria-label="口令" id="entry-password" type="password" autocomplete="current-password" placeholder="请输入口令" required maxlength="128">
      </label>
      <button type="submit" class="primary auth-submit">登录</button>
    </form>
    <div class="auth-divider"><span>其他方式</span></div>
    <button id="entry-login" type="button" class="auth-sso hidden">用飞书登录</button>
  </div>
  <div class="auth-links"><a id="entry-password-login" class="hidden" href="index.html">进入完整控制台 / 管理后台</a></div>
</section>
<header class="entry-top app-shell">
  <div class="entry-brand-wrap">
    <span class="brand-seal sm" aria-hidden="true">玄</span>
    <strong class="entry-brand">玄圃</strong>
    <span class="entry-tag">智能工作台</span>
  </div>
  <nav class="entry-nav" aria-label="工作台操作">
    <span id="entry-user" class="entry-user"></span>
    <button id="entry-live-focus" type="button" class="nav-pill live-focus-pill hidden" title="当前进行中的跨轮任务焦点"></button>
    <button id="entry-workbench" type="button" class="nav-pill" aria-pressed="false" title="打开辅助工作台（任务板、过程产物、跨节点诊断与发布回退）">工作台</button>
    <button id="entry-contacts" type="button" class="nav-pill" aria-pressed="false" title="打开书架资料室（通讯录、公司、项目、记录与文件）">书架资料</button>
    <button id="entry-board" type="button" class="nav-pill" aria-pressed="false" title="打开看板（待办、日程与提醒）">看板</button>
    <button id="entry-autonomy" data-autonomy="1" type="button" class="nav-pill active" aria-pressed="true" title="开启后，私人助理可直接帮你整理随手记/会议纪要并办理个人待办、日程与提醒（均可一键撤回）；关闭后每次先出确认卡">自主办理：开</button>
    <button id="entry-clear" type="button" class="nav-pill" title="开启干净的新对话上下文，不影响已保存的联系人与事项">清空对话</button>
    <a id="entry-more" class="nav-pill" href="index.html?classic=1">更多</a>
    <button id="entry-notifications" type="button" class="nav-pill">通知</button>
    <button id="entry-logout" type="button" class="nav-pill">退出</button>
  </nav>
</header>
<main id="entry-main" class="entry-main hidden">
  <section id="stage" class="stage" aria-label="小院"></section>
  <section id="overview" class="overview" aria-label="概览" aria-live="polite"></section>
  <section id="transcript" class="transcript" aria-label="对话" aria-live="polite"></section>
  <section id="tips" class="tips" aria-label="提示"></section>
  <form id="composer" class="composer">
    <div id="composer-files" class="composer-files hidden" aria-label="已选附件"></div>
    <div class="composer-row">
      <label class="sr-only" for="message">告诉我你想办什么</label>
      <textarea id="message" rows="2" placeholder="告诉我你想办什么，或上传文档/纪要让我自动整理，Enter 发送"></textarea>
      <input id="entry-file-input" type="file" class="hidden" multiple>
      <div class="composer-side">
        <button id="entry-attach" type="button" class="loc-btn" title="上传文档或纪要，让助理自动读取整理">附件</button>
        <button id="entry-location" type="button" class="loc-btn" title="允许浏览器获取当前位置，便于路线与天气查询">定位</button>
        <button id="send" type="submit" class="primary">发送</button>
      </div>
    </div>
  </form>
</main>
<div id="contacts-overlay" class="ab-overlay hidden" role="dialog" aria-modal="true" aria-label="书架资料室"></div>
<div id="board-overlay" class="ab-overlay hidden" role="dialog" aria-modal="true" aria-label="看板"></div>
<div id="workbench-overlay" class="ab-overlay hidden" role="dialog" aria-modal="true" aria-label="辅助工作台"></div>
<aside id="entry-notification-alerts" class="entry-notif-alerts hidden" aria-label="新通知提示">
  <div id="entry-notification-alert-list" class="entry-notif-list"></div>
  <button id="entry-notification-alert-more" type="button" class="entry-notif-more hidden">更多通知，点击查看全部</button>
</aside>
<div id="entry-status" class="sr-only" role="status" aria-live="polite"></div>
<script src="entry.js?v=01ee9e9d8959967a"></script>
<script src="bubble-format.js?v=7f50e810150281c0"></script>
<script src="entry-notifications.js?v=7bc1f3f119a1154a"></script>
<script src="capture-card.js?v=0b0eefb921849b68"></script>
<script src="people-graph.js?v=94fe847fb6980576"></script>
<script src="contacts-drawer.js?v=fe0a388cc7c6e9c8"></script>
<script src="board-drawer.js?v=80c7f1f93ab7bd94"></script>
<script src="workbench-drawer.js?v=5688e7222986337c"></script>
<script src="cards.js?v=1c788439444c3daf"></script>
<script src="module-cards.js?v=7282668ce36bcc5d"></script>
<script src="collab-cards.js?v=5595dd061d6b6522"></script>
<script src="courtyard-art.js?v=7b6a2fb2519e7cd9"></script>
<script src="courtyard-model.js?v=42abe492438510a0"></script>
<script src="courtyard-scene.js?v=c78a5f6b14296ffa"></script>
<script src="courtyard-card.js?v=3479ff533bc8ef61"></script>
<script src="courtyard-stage.js?v=bc296c8f39305597"></script>
<script src="progress-card.js?v=1c2ab42304f33338"></script>
<script src="dashboard.js?v=2105cdfd5e6a71e3"></script>
<script src="tips.js?v=7dc2ec3cf51ba655"></script>
<script src="entry-boot.js?v=5f3c4a085e83e8be"></script>
</body>
</html>
