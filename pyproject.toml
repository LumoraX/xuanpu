# 玄圃（xuanpu）—— 统一企业级 Agent 平台工程（不再拆多 PyPI 子包，整体构建与运行）。
# 内核 taifeng 与两个适配包仍以 git submodule 放在 external/ 下（editable 联调）。

[project]
name = "xuanpu"
version = "2026.11.22.0"
description = "玄圃（xuanpu）—— 基于 taifeng 内核的企业级服务端 Agent 平台"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Xuanpu Contributors" },
]
dependencies = [
    # 内核与适配包（通过 external/ 子模块 editable 接入）
    "taifeng>=2026.11.14.1",
    "taifeng-sandbox>=2026.10.21.1",
    "taifeng-stores",
    # 规范、服务端、CLI、SDK 与财务子系统统一依赖
    "anyio>=4",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "cryptography>=42",
    "defusedxml>=0.7.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pillow>=12",
    "prometheus_client>=0.20",
    "pydantic>=2.6",
    "PyJWT[crypto]>=2.10",
    "pypdf>=6",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "taifeng-stores[postgres]",
]
otel = [
    "taifeng[telemetry-otel]>=2026.11.14.1",
]
s3 = [
    "boto3>=1.34",
]

[project.scripts]
xuanpu = "cli.main:main"
xuanpu-finance = "finance.__main__:main"
xuanpu-finance-maintenance = "finance.maintenance_cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "web", "cli", "spec", "sdk", "finance"]

[tool.uv.sources]
taifeng = { path = "external/taifeng", editable = true }
taifeng-sandbox = { path = "external/taifeng-sandbox", editable = true }
taifeng-stores = { path = "external/taifeng-stores", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "asyncpg-stubs>=0.29",
    "types-pyyaml>=6.0",
    "boto3>=1.34",
    "taifeng[telemetry-otel]",
    "moto[server]>=5.0",
    "boto3-stubs[s3]",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["external", "desktop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "S", "B", "C4", "RET", "SIM", "TC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"server/core/controlplane/postgres.py" = ["S608"]
"server/core/controlplane/postgres_audit.py" = ["S608"]
"server/core/controlplane/schema.py" = ["S608"]
"server/domains/identity/postgres.py" = ["S608"]
"server/domains/identity/postgres_users.py" = ["S608"]
"server/engine/tracing/postgres.py" = ["S608"]
"tests/**" = ["S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
