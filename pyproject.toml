# 工作区根：只承载开发依赖与统一的 lint / 测试 / 类型检查配置，本身不发布。
# 每个组件是 packages/ 下的独立包，各自版本、各自发布（ADR 0001 决策 4）。

[tool.uv.workspace]
members = ["packages/*"]

# 两个适配包尚未发布到 PyPI，开发期从同级目录取源码；发布后删掉这两行，改由版本号约束。
# 内核 taifeng 从 PyPI 取（xuanpu-server 声明了版本下限）。
[tool.uv.sources]
taifeng-sandbox = { path = "../taifeng-sandbox", editable = true }
taifeng-stores = { path = "../taifeng-stores", editable = true }
xuanpu-spec = { workspace = true }
xuanpu-server = { workspace = true }
xuanpu-cli = { workspace = true }
xuanpu-sdk-py = { workspace = true }
xuanpu-console = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    # 平台服务的测试用 SDK 走一遍接口（服务本身不依赖 SDK）
    "xuanpu-sdk-py",
    "asyncpg-stubs>=0.29",
    "types-pyyaml>=6.0",
    # 对象存储的 S3 实现及其测试（moto 起本机 S3 服务）
    "boto3>=1.34",
    "moto[server]>=5.0",
    "boto3-stubs[s3]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "S", "B", "C4", "RET", "SIM", "TC"]
# S101(裸 assert)放行：沿用 taifeng 口径——assert 只用于 mypy strict 要求的类型收窄
# (断内部不变量)；外部输入校验一律抛异常，不用 assert。
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# S608(拼接 SQL)：拼进 SQL 的只有表名，来自 SqlNamespace——其字符集在构造时校验为
# [a-z0-9_]；所有取值一律走参数绑定
"packages/xuanpu-server/src/xuanpu_server/controlplane/postgres.py" = ["S608"]
"packages/xuanpu-server/src/xuanpu_server/controlplane/postgres_audit.py" = ["S608"]
"packages/xuanpu-server/src/xuanpu_server/controlplane/schema.py" = ["S608"]
# 身份存储与控制面共用命名空间，同一理由；另有 SET 子句片段，只来自模块内写死的字面量
"packages/xuanpu-server/src/xuanpu_server/identity/postgres.py" = ["S608"]
"packages/xuanpu-server/src/xuanpu_server/identity/postgres_users.py" = ["S608"]
# S108(硬编码 /tmp)：tests/ 里只允许作占位字符串，真落盘必须用 tmp_path fixture
"packages/*/tests/**" = ["S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
# 各包 tests/ 下会有同名测试文件，importlib 模式避免模块名冲突
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
